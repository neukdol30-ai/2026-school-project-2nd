<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상담 홈</title>
    <link rel="stylesheet" th:href="@{/css/chat/chat-home.css}">

</head>
<body>

<div class="talk-wrap">
    <div class="hero">
        <div class="hero-title">SecondPro 상담센터</div>
        <div class="hero-sub">
            메일, 지도, 증권, 뉴스, 날씨, 캘린더 사용 중<br>
            궁금한 점을 실시간으로 문의해보세요.
        </div>
    </div>

    <div class="card">
        <div class="brand-row">
            <div class="brand-icon">💬</div>
            <div>
                <div class="brand-name">SecondPro Help</div>
                <div class="brand-status">⚡ 빠르게 답변 받을 수 있어요</div>
            </div>
        </div>

        <div class="welcome">
            안녕하세요.
            <b th:text="${loginUser.nickname}">사용자</b>님 😊<br>
            무엇을 도와드릴까요?
        </div>

        <div class="quick-title">문의 유형을 선택해주세요</div>

        <div class="quick-grid">
            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="MAIL">
                <button class="quick-btn" type="submit">📧 메일 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="MAP">
                <button class="quick-btn" type="submit">🗺 지도 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="STOCK">
                <button class="quick-btn" type="submit">📈 증권 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="NEWS">
                <button class="quick-btn" type="submit">📰 뉴스 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="WEATHER">
                <button class="quick-btn" type="submit">🌤 날씨 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="CALENDAR">
                <button class="quick-btn" type="submit">📅 캘린더 문의</button>
            </form>

            <form class="quick-form" action="/chat/start" method="post">
                <input type="hidden" name="category" value="ETC">
                <button class="quick-btn" type="submit">💬 기타 문의</button>
            </form>
        </div>

        <div class="main-action" th:if="${openRoom != null}">
            <a th:href="@{/chat/room/{roomNo}(roomNo=${openRoom.roomNo})}">
                기존 대화 이어가기
            </a>
        </div>
    </div>

    <div class="notice">
        상담 내용은 서비스 품질 향상과 문의 이력 확인을 위해 저장될 수 있습니다.
    </div>

    <div class="bottom-nav">
        <a href="/chat" class="nav-item active">
            <span class="nav-icon">🏠</span>
            홈
        </a>
        <a th:href="${openRoom != null} ? @{/chat/room/{roomNo}(roomNo=${openRoom.roomNo})} : '#'"
           class="nav-item">
            <span class="nav-icon">💬</span>
            대화
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">⚙️</span>
            설정
        </a>
    </div>
</div>

</body>
</html>
