<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 상담 채팅</title>
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">

</head>
<body>

<div class="chat-wrap">
    <div class="chat-header">
        <a href="/chat" class="back-link">‹</a>

        <div class="header-icon">
            <span th:text="${chatRoom.categoryIcon}">💬</span>
        </div>

        <div class="header-info">
            <div class="header-title">SecondPro 상담센터</div>
            <div class="header-sub">빠르게 답변 받을 수 있어요</div>
        </div>

        <div class="category-badge" th:text="${chatRoom.categoryName}">
            일반 문의
        </div>
    </div>

    <div class="chat-notice">
        <div>
            선택한 문의 유형:
            <b th:text="${chatRoom.categoryName}">일반 문의</b>
        </div>

        <div class="category-change-box"
             th:if="${chatRoom.status == 'OPEN' and loginUser.role == 'USER'}">
            <form th:action="@{/chat/{roomNo}/category(roomNo=${chatRoom.roomNo})}"
                  method="post"
                  class="category-change-form">
                <select name="category">
                    <option value="MAIL" th:selected="${chatRoom.category == 'MAIL'}">메일 문의</option>
                    <option value="MAP" th:selected="${chatRoom.category == 'MAP'}">지도 문의</option>
                    <option value="STOCK" th:selected="${chatRoom.category == 'STOCK'}">증권 문의</option>
                    <option value="NEWS" th:selected="${chatRoom.category == 'NEWS'}">뉴스 문의</option>
                    <option value="WEATHER" th:selected="${chatRoom.category == 'WEATHER'}">날씨 문의</option>
                    <option value="CALENDAR" th:selected="${chatRoom.category == 'CALENDAR'}">캘린더 문의</option>
                    <option value="ETC" th:selected="${chatRoom.category == 'ETC'}">기타 문의</option>
                </select>

                <button type="submit">유형 변경</button>
            </form>
        </div>

        <div class="notice-text">
            문의 내용을 남겨주시면 관리자가 확인 후 답변드립니다.
        </div>
    </div>

    <div id="chatBody" class="chat-body"></div>

    <div class="chat-input-box">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요">
        <button type="button" id="sendBtn">전송</button>
    </div>
</div>

<script th:inline="javascript">
    const roomNo = /*[[${chatRoom.roomNo}]]*/ 0;
    const senderNo = /*[[${loginUser.no}]]*/ 0;
    const loginRole = /*[[${loginUser.role}]]*/ "USER";
    const roomUserNo = /*[[${chatRoom.userNo}]]*/ 0;
    const roomStatus = /*[[${chatRoom.status}]]*/ "OPEN";
</script>

<script src="/js/chat.js"></script>

</body>
</html>
