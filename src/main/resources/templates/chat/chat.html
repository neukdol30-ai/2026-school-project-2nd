<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>1:1 상담 채팅</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f7;
        }

        .chat-wrap {
            width: 420px;
            height: 620px;
            margin: 50px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px;
            background: #03c75a;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f1f3f5;
        }

        .message-row {
            margin-bottom: 12px;
            display: flex;
        }

        .message-row.me {
            justify-content: flex-end;
        }

        .message-row.other {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-row.me .message-bubble {
            background: #03c75a;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.other .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .chat-input-box {
            display: flex;
            padding: 12px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }

        #sendBtn {
            margin-left: 8px;
            padding: 0 18px;
            border: none;
            border-radius: 20px;
            background: #03c75a;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #sendBtn:hover {
            background: #02b350;
        }
    </style>
</head>
<body>

<div class="chat-wrap">
    <div class="chat-header">
        1:1 실시간 상담
    </div>

    <div id="chatBody" class="chat-body"></div>

    <div class="chat-input-box">
        <input type="text" id="messageInput" placeholder="메시지를 입력하세요">
        <button type="button" id="sendBtn">전송</button>
    </div>
</div>

<script th:inline="javascript">
    const roomNo = /*[[${chatRoom.roomNo}]]*/ 0;
    const senderNo = /*[[${loginUser.no}]]*/ 0;
</script>

<script src="/js/chat.js"></script>

</body>
</html>
