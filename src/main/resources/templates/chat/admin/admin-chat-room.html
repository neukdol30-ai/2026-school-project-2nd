<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 상담방</title>
    <link rel="stylesheet" th:href="@{/css/chat/admin/admin-chat-room.css}">
    <link rel="stylesheet" href="/css/cookie-consent.css">
</head>
<body>
<div class="admin-room-page">
    <aside class="side-panel">
        <a th:href="@{/chat/admin}" class="list-btn">← 목록으로 돌아가기</a>

        <div class="side-title">
            <span th:text="${chatRoom.categoryIcon}">💬</span>
            <div>
                <h1>상담방 #<b th:text="${chatRoom.roomNo}">0</b></h1>
                <p th:text="${chatRoom.categoryName}">기타 문의</p>
            </div>
        </div>

        <div class="info-stack">
            <div class="info-card">
                <span>사용자 번호</span>
                <strong th:text="${chatRoom.userNo != null ? chatRoom.userNo : '탈퇴 회원'}">1</strong>
            </div>
            <div class="info-card">
                <span>담당 관리자</span>
                <strong th:text="${chatRoom.adminNo != null ? chatRoom.adminNo : '미배정'}">미배정</strong>
            </div>
            <div class="info-card">
                <span>상담 상태</span>
                <strong th:classappend="${chatRoom.status == 'OPEN'} ? ' status-open' : ' status-closed'" th:text="${chatRoom.status == 'OPEN'} ? '진행중' : '종료'">진행중</strong>
            </div>
            <div class="info-card">
                <span>생성 시간</span>
                <strong th:text="${chatRoom.createdDate != null ? #temporals.format(chatRoom.createdDate, 'MM-dd HH:mm') : '-'}">-</strong>
            </div>
        </div>

        <div class="side-actions">
            <form th:if="${chatRoom.status == 'OPEN'}" th:action="@{/chat/{roomNo}/close(roomNo=${chatRoom.roomNo})}" method="post" onsubmit="return confirm('상담을 종료하시겠습니까? 종료 후에는 메시지를 보낼 수 없습니다.');">
                <button type="submit" class="close-btn">상담 종료</button>
            </form>

            <form th:if="${chatRoom.status == 'CLOSED'}" th:action="@{/chat/admin/{roomNo}/delete(roomNo=${chatRoom.roomNo})}" method="post" onsubmit="return confirm('상담방과 메시지가 모두 삭제됩니다. 정말 삭제하시겠습니까?');">
                <button type="submit" class="delete-btn">상담방 삭제</button>
            </form>
        </div>
    </aside>

    <section class="chat-panel">
        <header class="chat-header">
            <div>
                <span class="eyebrow">Admin Reply</span>
                <h2>사용자 문의 응대</h2>
                <p>왼쪽은 사용자 메시지, 오른쪽은 관리자 답변입니다.</p>
            </div>
            <span class="category-chip">
                <span th:text="${chatRoom.categoryIcon}">💬</span>
                <b th:text="${chatRoom.categoryName}">기타 문의</b>
            </span>
        </header>

        <div class="notice-bar">
            상담 종료 전까지 실시간 답변이 가능합니다. 종료 후에는 입력창이 자동 비활성화됩니다.
        </div>

        <div id="chatBody" class="chat-body"></div>

        <div class="chat-input-box">
            <input type="text" id="messageInput" th:placeholder="${chatRoom.status == 'CLOSED'} ? '상담이 종료되었습니다.' : '답변을 입력하세요'" th:disabled="${chatRoom.status == 'CLOSED'}">
            <button type="button" id="sendBtn" th:disabled="${chatRoom.status == 'CLOSED'}">전송</button>
        </div>
    </section>
</div>

<script th:inline="javascript">
    const roomNo = /*[[${chatRoom.roomNo}]]*/ 0;
    const senderNo = /*[[${loginUser.no}]]*/ 0;
    const loginRole = /*[[${loginUser.role}]]*/ "ADMIN";
    const roomUserNo = /*[[${chatRoom.userNo}]]*/ 0;
    const roomStatus = /*[[${chatRoom.status}]]*/ "OPEN";
</script>
<script th:src="@{/js/chat.js}"></script>
    <script src="/js/cookie-consent.js"></script>
</body>
</html>
