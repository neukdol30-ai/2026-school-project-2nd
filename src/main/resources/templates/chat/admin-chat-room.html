<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 채팅방</title>
    <link rel="stylesheet" th:href="@{/css/chat/admin-chat-room.css}">
</head>
<body>

<!--
    관리자 상담방 상세 화면

    연결 파일:
    - CSS: /css/chat/admin-chat-room.css
    - JS: /js/chat.js

    역할:
    - 관리자 실시간 답변
    - 상담방 정보 확인
    - 상담 종료
    - 종료 상담방 삭제
-->
<div class="admin-chat-layout">

    <aside class="side-panel">
        <div class="side-title">상담 정보</div>

        <div class="info-card">
            <div class="info-label">채팅방 번호</div>
            <div class="info-value">
                #<span th:text="${chatRoom.roomNo}"></span>
            </div>
        </div>

        <div class="info-card">
            <div class="info-label">문의 유형</div>
            <div class="info-value">
                <span class="category-badge">
                    <span th:text="${chatRoom.categoryIcon}">💬</span>
                    <span th:text="${chatRoom.categoryName}">일반 문의</span>
                </span>
            </div>
        </div>

        <div class="info-card">
            <div class="info-label">사용자 번호</div>
            <div class="info-value" th:text="${chatRoom.userNo != null ? chatRoom.userNo : '탈퇴 회원'}">
                1
            </div>
        </div>

        <div class="info-card">
            <div class="info-label">상담 상태</div>
            <div class="info-value"
                 th:classappend="${chatRoom.status == 'OPEN'} ? ' status-open' : ' status-closed'"
                 th:text="${chatRoom.status}">
                OPEN
            </div>
        </div>

        <div class="side-actions">
            <a href="/chat/admin" class="list-btn">목록으로 돌아가기</a>

            <!-- OPEN 상태일 때만 상담 종료 버튼 표시 -->
            <form th:if="${chatRoom.status == 'OPEN'}"
                  th:action="@{/chat/{roomNo}/close(roomNo=${chatRoom.roomNo})}"
                  method="post"
                  onsubmit="return confirm('상담을 종료하시겠습니까? 종료 후에는 메시지를 보낼 수 없습니다.');">
                <button type="submit" class="close-btn">상담 종료</button>
            </form>

            <!-- CLOSED 상태일 때만 상담방 삭제 버튼 표시 -->
            <form th:if="${chatRoom.status == 'CLOSED'}"
                  th:action="@{/chat/admin/{roomNo}/delete(roomNo=${chatRoom.roomNo})}"
                  method="post"
                  onsubmit="return confirm('상담방과 메시지가 모두 삭제됩니다. 정말 삭제하시겠습니까?');">
                <button type="submit" class="delete-btn">상담방 삭제</button>
            </form>
        </div>
    </aside>

    <section class="chat-wrap">
        <div class="chat-header">
            <div class="header-icon">
                <span th:text="${chatRoom.categoryIcon}">💬</span>
            </div>

            <div class="header-info">
                <div class="header-title">
                    사용자 상담방
                    #<span th:text="${chatRoom.roomNo}"></span>
                </div>
                <div class="header-sub">
                    사용자의 문의 내용을 확인하고 실시간으로 답변하세요.
                </div>
            </div>

            <span class="category-badge">
                <span th:text="${chatRoom.categoryName}">일반 문의</span>
            </span>
        </div>

        <div class="admin-notice">
            관리자 계정으로 접속 중입니다.
            사용자가 보낸 메시지는 왼쪽, 관리자가 보낸 답변은 오른쪽에 표시됩니다.
        </div>

        <!-- 메시지 목록은 chat.js에서 렌더링 -->
        <div id="chatBody" class="chat-body"></div>

        <div class="chat-input-box">
            <input type="text"
                   id="messageInput"
                   th:placeholder="${chatRoom.status == 'CLOSED'} ? '상담이 종료되었습니다.' : '답변을 입력하세요'"
                   th:disabled="${chatRoom.status == 'CLOSED'}">

            <button type="button"
                    id="sendBtn"
                    th:disabled="${chatRoom.status == 'CLOSED'}">
                전송
            </button>
        </div>
    </section>

</div>

<script th:inline="javascript">
    const roomNo = /*[[${chatRoom.roomNo}]]*/ 0;
    const senderNo = /*[[${loginUser.no}]]*/ 0;
    const loginRole = /*[[${loginUser.role}]]*/ "ADMIN";
    const roomUserNo = /*[[${chatRoom.userNo}]]*/ 0;
    const roomStatus = /*[[${chatRoom.status}]]*/ "OPEN";
</script>

<script src="/js/chat.js"></script>

</body>
</html>
