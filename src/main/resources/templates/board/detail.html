<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-viewer.min.js"></script>
</head>
<body>




<h1 th:text="${board.title}"></h1>

<p>
    카테고리:
    <span th:text="${board.category}"></span>
</p>

<p>
    작성자:
    <span th:text="${board.writerNickname != null ? board.writerNickname : '탈퇴회원'}"></span>
</p>

<p>
    조회수:
    <span th:text="${board.viewCount}"></span>
</p>

<hr>

<div th:utext="${board.content}"></div>

<hr>

<a href="/board/list">목록</a>

<div sec:authorize="isAuthenticated()"
     th:if="${#authentication.principal.memberDto.no.equals(board.writerNo)}">

    <a th:href="@{/board/update/{no}(no=${board.no})}">
        수정
    </a>

    <form th:action="@{/board/delete/{no}(no=${board.no})}"
          method="post"
          style="display:inline;">

        <button type="submit"
                onclick="return confirm('게시글을 삭제하시겠습니까?');">
            삭제
        </button>

    </form>

</div>


<div th:if="${board.category != 'NOTICE'}">

    <hr>

    <h2>댓글</h2>

    <!-- 댓글 등록·수정 실패 메시지 -->
    <p th:if="${commentError}"
       th:text="${commentError}"
       style="color:red;">
    </p>

    <div th:if="${#lists.isEmpty(commentList)}">
        <p>아직 댓글이 없습니다.</p>
    </div>

    <div th:each="comment : ${commentList}">

        <p>
            <strong th:text="${comment.writerNickname != null
                ? comment.writerNickname
                : '탈퇴회원'}"></strong>
            :
            <span th:id="'comment-text-' + ${comment.no}"
                  th:text="${comment.content}"></span>
        </p>

        <!-- 로그인했고, 현재 회원이 댓글 작성자인 경우에만 표시 -->
        <div sec:authorize="isAuthenticated()"
             th:if="${#authentication.principal.memberDto.no.equals(comment.writerNo)}">

            <button type="button"
                    th:onclick="'showEditForm(' + ${comment.no} + ')'">
                수정
            </button>

            <form th:action="@{/board/comment/delete/{no}(no=${comment.no})}"
                  method="post"
                  style="display:inline;">

                <button type="submit"
                        onclick="return confirm('댓글을 삭제하시겠습니까?');">
                    삭제
                </button>

            </form>

            <form th:id="'comment-edit-form-' + ${comment.no}"
                  th:action="@{/board/comment/update/{no}(no=${comment.no})}"
                  method="post"
                  style="display:none; margin-top:10px;">

            <textarea name="content"
                      rows="3"
                      cols="50"
                      maxlength="1000"
                      required
                      th:text="${comment.content}"></textarea>

                <br>

                <button type="submit">저장</button>

                <button type="button"
                        th:onclick="'hideEditForm(' + ${comment.no} + ')'">
                    취소
                </button>
            </form>
        </div>
    </div>

    <!-- ========================= -->
    <!-- 댓글 작성 -->
    <!-- ========================= -->
        <hr>

        <h3>댓글 작성</h3>

        <form action="/board/comment/write" method="post">

            <input type="hidden"
                    name="boardNo"
                    th:value="${board.no}">

            <textarea name="content"
                      rows="3"
                      cols="50"
                      maxlength="1000"
                      required
                      placeholder="댓글을 입력하세요"></textarea>

            <br>

            <button type="submit">
            댓글 등록
            </button>

        </form>

</div>

<script>
    function showEditForm(commentNo) {
        const form = document.getElementById("comment-edit-form-" + commentNo);
        const textarea = form.querySelector("textarea");

        form.style.display = "block";
        textarea.focus();

        textarea.selectionStart = textarea.value.length;
        textarea.selectionEnd = textarea.value.length;
    }

    function hideEditForm(commentNo) {
        const form = document.getElementById("comment-edit-form-" + commentNo);
        form.style.display = "none";
    }
</script>






</body>
</html>
