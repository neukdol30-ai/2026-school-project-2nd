<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>글쓰기</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/main.css}">

    <!-- 게시판 전용 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/board.css}">

    <!-- 쿠키 동의 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/cookie-consent.css}">

    <!-- TOAST UI Editor CSS -->
    <link rel="stylesheet"
          href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

    <!-- TOAST UI Editor JS -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.js"></script>
</head>

<body>

<main class="board-page">

    <!-- 글쓰기 상단 제목 -->
    <section class="board-form-header">

        <div>
            <h1 class="board-form-title">
                게시글 작성
            </h1>

            <p class="board-form-description"
               sec:authorize="isAuthenticated()">
                새로운 게시글을 작성해주세요.
            </p>

            <p class="board-form-description"
               sec:authorize="isAnonymous()">
                비회원 문의글을 작성하려면 이름과 비밀번호를 입력해주세요.
            </p>
        </div>

        <a th:href="@{/board/question}"
           class="board-main-link">
            목록으로
        </a>

    </section>

    <!-- 게시글 작성 카드 -->
    <section class="board-form-box">

        <form id="board-write-form"
              data-board-form
              th:action="@{/board/write}"
              method="post"
              th:object="${boardDto}">

            <!-- 로그인 회원용 카테고리 -->
            <div class="board-form-group"
                 sec:authorize="isAuthenticated()">

                <label for="category"
                       class="board-form-label">
                    카테고리
                </label>

                <select id="category"
                        th:field="*{category}"
                        class="board-form-select">

                    <option value="QUESTION">
                        문의 게시판
                    </option>

                    <!-- 관리자에게만 공지사항 표시 -->
                    <option value="NOTICE"
                            sec:authorize="hasRole('ADMIN')">
                        공지사항
                    </option>

                </select>

                <p th:if="${#fields.hasErrors('category')}"
                   th:errors="*{category}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 비회원용 고정 카테고리 -->
            <div sec:authorize="isAnonymous()"
                 class="guest-category-section">

                <!-- 비회원은 QUESTION만 작성 가능 -->
                <input type="hidden"
                       name="category"
                       value="QUESTION">

                <div class="board-form-group">

                    <label class="board-form-label">
                        카테고리
                    </label>

                    <input type="text"
                           class="board-form-input"
                           value="문의 게시판"
                           readonly>

                    <p th:if="${#fields.hasErrors('category')}"
                       th:errors="*{category}"
                       class="board-form-error">
                    </p>

                </div>

            </div>

            <!-- 비회원 작성자 정보 -->
            <div sec:authorize="isAnonymous()">

                <!-- 비회원 이름 -->
                <div class="board-form-group">

                    <label for="guestName"
                           class="board-form-label">
                        작성자 이름
                    </label>

                    <input id="guestName"
                           type="text"
                           th:field="*{guestName}"
                           class="board-form-input"
                           maxlength="50"
                           autocomplete="name"
                           placeholder="작성자 이름을 입력해주세요.">

                    <p th:if="${#fields.hasErrors('guestName')}"
                       th:errors="*{guestName}"
                       class="board-form-error">
                    </p>

                </div>

                <!-- 비회원 비밀번호 -->
                <div class="board-form-group">

                    <label for="guestPassword"
                           class="board-form-label">
                        비밀번호
                    </label>

                    <input id="guestPassword"
                           type="password"
                           th:field="*{guestPassword}"
                           class="board-form-input"
                           maxlength="100"
                           autocomplete="new-password"
                           placeholder="수정·삭제 시 사용할 비밀번호를 입력해주세요.">

                    <p class="board-form-description">
                        입력한 비밀번호는 문의글 수정과 삭제에 사용됩니다.
                    </p>

                    <p th:if="${#fields.hasErrors('guestPassword')}"
                       th:errors="*{guestPassword}"
                       class="board-form-error">
                    </p>

                </div>

            </div>

            <!-- 제목 -->
            <div class="board-form-group">

                <label for="title"
                       class="board-form-label">
                    제목
                </label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       class="board-form-input"
                       placeholder="제목을 입력해주세요.">

                <p th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 본문 -->
            <div class="board-form-group">

                <label class="board-form-label">
                    내용
                </label>

                <!-- TOAST UI Editor 영역 -->
                <div id="editor"
                     class="board-editor"
                     data-board-editor>
                </div>

                <!-- 서버로 전송할 본문 HTML -->
                <input type="hidden"
                       id="content"
                       data-board-content
                       th:field="*{content}">

                <p th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}"
                   class="board-form-error">
                </p>

                <p th:if="${contentError}"
                   th:text="${contentError}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 하단 버튼 -->
            <div class="board-form-actions">

                <a th:href="@{/board/question}"
                   class="board-button board-button-secondary">
                    취소
                </a>

                <button type="submit"
                        class="board-button board-button-primary">
                    등록
                </button>

            </div>

        </form>

    </section>

</main>

<script th:src="@{/js/board/board-editor.js}"></script>
<script th:src="@{/js/cookie-consent.js}"></script>

</body>
</html>
