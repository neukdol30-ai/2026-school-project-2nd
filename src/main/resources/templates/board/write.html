<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>글쓰기</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/main.css}">

    <!-- 공통 헤더·푸터 디자인 -->
    <link rel="stylesheet"
          th:href="@{/css/index.css}">

    <!-- 마이페이지 모달 -->
    <link rel="stylesheet"
          th:href="@{/css/mypage-modal.css}">

    <!-- 쿠키 동의 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/cookie-consent.css}">

    <!-- TOAST UI Editor CSS -->
    <link rel="stylesheet"
          href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

    <!-- 게시판 전용 CSS는 마지막 -->
    <link rel="stylesheet"
          th:href="@{/css/board.css}">


</head>

<body class="board-body">

<!-- 공통 헤더 -->
<div class="global-banner-area">
    <div data-global-banner></div>
</div>

<main class="board-page">

    <!-- 글쓰기 상단 제목 -->
    <section class="board-form-header">

        <div>
            <h1 class="board-form-title">
                게시글 작성
            </h1>

            <p class="board-form-description"
               sec:authorize="isAuthenticated()">
                새로운 게시글을 작성해주세요.
            </p>

            <p class="board-form-description"
               sec:authorize="isAnonymous()">
                비회원 문의글을 작성하려면 이름과 비밀번호를 입력해주세요.
            </p>
        </div>

        <a th:href="@{/board/question}"
           class="board-main-link">
            목록으로
        </a>

    </section>

    <!-- 게시글 작성 카드 -->
    <section class="board-form-box">

        <form id="board-write-form"
              data-board-form
              th:action="@{/board/write}"
              method="post"
              th:object="${boardDto}">

            <!-- 로그인 회원용 카테고리 -->
            <div class="board-form-group"
                 sec:authorize="isAuthenticated()">

                <label for="category"
                       class="board-form-label">
                    카테고리
                </label>

                <select id="category"
                        th:field="*{category}"
                        class="board-form-select">

                    <option value="QUESTION">
                        문의 게시판
                    </option>

                    <!-- 관리자에게만 공지사항 표시 -->
                    <option value="NOTICE"
                            sec:authorize="hasRole('ADMIN')">
                        공지사항
                    </option>

                </select>

                <p th:if="${#fields.hasErrors('category')}"
                   th:errors="*{category}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 비회원용 고정 카테고리 -->
            <div sec:authorize="isAnonymous()"
                 class="guest-category-section">

                <!-- 비회원은 QUESTION만 작성 가능 -->
                <input type="hidden"
                       name="category"
                       value="QUESTION">

                <div class="board-form-group">

                    <label class="board-form-label">
                        카테고리
                    </label>

                    <input type="text"
                           class="board-form-input"
                           value="문의 게시판"
                           readonly>

                    <p th:if="${#fields.hasErrors('category')}"
                       th:errors="*{category}"
                       class="board-form-error">
                    </p>

                </div>

            </div>

            <!-- 비회원 작성자 정보 -->
            <div sec:authorize="isAnonymous()">

                <!-- 비회원 이름 -->
                <div class="board-form-group">

                    <label for="guestName"
                           class="board-form-label">
                        작성자 이름
                    </label>

                    <input id="guestName"
                           type="text"
                           th:field="*{guestName}"
                           class="board-form-input"
                           maxlength="50"
                           required
                           autocomplete="name"
                           placeholder="작성자 이름을 입력해주세요.">

                    <p th:if="${#fields.hasErrors('guestName')}"
                       th:errors="*{guestName}"
                       class="board-form-error">
                    </p>

                </div>

                <!-- 비회원 비밀번호 -->
                <div class="board-form-group">

                    <label for="guestPassword"
                           class="board-form-label">
                        비밀번호
                    </label>

                    <input id="guestPassword"
                           type="password"
                           th:field="*{guestPassword}"
                           class="board-form-input"
                           minlength="4"
                           maxlength="20"
                           required
                           autocomplete="new-password"
                           placeholder="비밀번호를 4~20자로 입력해주세요.">

                    <div class="guest-password-notice">

                        <p class="guest-password-notice-title">
                            비밀번호 사용 안내
                        </p>

                        <ul class="guest-password-notice-list">

                            <li>
                                비밀번호는 4자 이상 20자 이하로 입력해주세요.
                            </li>

                            <li>
                                입력한 비밀번호는 문의글 수정과 삭제에 사용됩니다.
                            </li>

                            <li>
                                비밀번호를 분실하면 확인하거나 복구하기 어렵습니다.
                            </li>

                            <li>
                                비회원 문의글은 답변 완료 후 30일이 지나면
                                자동으로 삭제됩니다.
                            </li>

                        </ul>

                    </div>

                    <p th:if="${#fields.hasErrors('guestPassword')}"
                       th:errors="*{guestPassword}"
                       class="board-form-error">
                    </p>

                </div>

            </div>

            <!-- 제목 -->
            <div class="board-form-group">

                <label for="title"
                       class="board-form-label">
                    제목
                </label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       class="board-form-input"
                       maxlength="200"
                       placeholder="제목을 입력해주세요.">

                <p th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 본문 -->
            <div class="board-form-group">

                <label class="board-form-label">
                    내용
                </label>

                <!-- TOAST UI Editor 영역 -->
                <div id="editor"
                     class="board-editor"
                     data-board-editor>
                </div>

                <!-- 서버로 전송할 본문 HTML -->
                <input type="hidden"
                       id="content"
                       data-board-content
                       th:field="*{content}">

                <p th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}"
                   class="board-form-error">
                </p>

                <p th:if="${contentError}"
                   th:text="${contentError}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 하단 버튼 -->
            <div class="board-form-actions">

                <a th:href="@{/board/question}"
                   class="board-button board-button-secondary">
                    취소
                </a>

                <button type="submit"
                        class="board-button board-button-primary">
                    등록
                </button>

            </div>

        </form>

    </section>

</main>

<!-- 공통 푸터 -->
<div data-global-footer></div>


<!-- =========================
     공통 헤더·푸터 관련 JS
========================= -->

<!-- banner.js에서 사용하는 상태와 공통 함수 -->
<script th:src="@{/js/index/state.js}"></script>
<script th:src="@{/js/index/utils.js}"></script>

<!-- 공통 헤더와 푸터 -->
<script th:src="@{/js/index/layout/banner.js}"></script>
<script th:src="@{/js/index/layout/footer.js}"></script>

<!-- 마이페이지 모달 -->
<script th:src="@{/js/common/address-search.js}"></script>
<script th:src="@{/js/mypage-modal.js}"></script>

<!-- 게시판 공통 헤더·푸터 실행 -->
<script th:src="@{/js/board/board-common-layout.js}"></script>


<!-- =========================
     TOAST UI Editor
========================= -->

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.js"></script>

<!-- TOAST UI Editor 설정 및 폼 전송 -->
<script th:src="@{/js/board/board-editor.js}"></script>

<!-- 쿠키 설정 -->
<script th:src="@{/js/cookie-consent.js}"></script>

</body>
</html>
