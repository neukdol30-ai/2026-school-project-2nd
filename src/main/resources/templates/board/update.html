<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>게시글 수정</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/main.css}">

    <!-- 공통 헤더·푸터 디자인 -->
    <link rel="stylesheet"
          th:href="@{/css/index.css}">

    <!-- 마이페이지 모달 -->
    <link rel="stylesheet"
          th:href="@{/css/mypage-modal.css}">

    <!-- 쿠키 동의 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/cookie-consent.css}">

    <!-- TOAST UI Editor CSS -->
    <link rel="stylesheet"
          href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">

    <!-- TOAST UI Editor JS -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.js"></script>
    <link rel="stylesheet" th:href="@{/css/cookie-consent.css}">
    <!-- 게시판 전용 CSS는 가장 마지막 -->
    <link rel="stylesheet"
          th:href="@{/css/board.css}">
</head>

<body class="board-body">

<!-- 공통 상단 헤더 -->
<div class="global-banner-area">
    <div data-global-banner></div>
</div>

<main class="board-page">


    <!-- 수정 화면 상단 제목 -->

    <section class="board-form-header">

        <div>
            <h1 class="board-form-title">
                게시글 수정
            </h1>

            <p class="board-form-description">
                게시글 내용을 수정한 뒤 저장해주세요.
            </p>
        </div>

        <a th:href="@{/board/detail/{no}(no=${board.no})}"
           class="board-main-link">
            상세보기로
        </a>

    </section>


    <!-- 게시글 수정 카드 -->

    <section class="board-form-box">

        <form id="board-update-form"
              th:action="${formAction}"
              method="post"
              th:object="${board}">

            <!-- 회원 수정용 카테고리 -->
            <div class="board-form-group"
                 th:if="${guestMode == false}">

                <label for="category"
                       class="board-form-label">
                    카테고리
                </label>

                <select id="category"
                        th:field="*{category}"
                        class="board-form-select">

                    <option value="QUESTION">
                        문의 게시판
                    </option>

                    <option value="NOTICE"
                            sec:authorize="hasRole('ADMIN')">
                        공지사항
                    </option>

                </select>

            </div>

            <!-- 비회원 수정용 카테고리 -->
            <div class="board-form-group"
                 th:if="${guestMode == true}">

                <label class="board-form-label">
                    카테고리
                </label>

                <input type="hidden"
                       th:field="*{category}">

                <input type="text"
                       value="문의 게시판"
                       class="board-form-input"
                       readonly>

            </div>

            <!-- 제목 -->
            <div class="board-form-group">

                <label for="title"
                       class="board-form-label">
                    제목
                </label>

                <input id="title"
                       type="text"
                       th:field="*{title}"
                       class="board-form-input"
                       placeholder="제목을 입력해주세요.">

                <!-- 제목 Validation 오류 -->
                <p th:if="${#fields.hasErrors('title')}"
                   th:errors="*{title}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 본문 -->
            <div class="board-form-group">

                <label class="board-form-label">
                    내용
                </label>

                <!-- TOAST UI Editor 영역 -->
                <div id="editor"
                     class="board-editor">
                </div>

                <!-- 서버로 전송할 HTML 본문 -->
                <input type="hidden"
                       id="content"
                       th:field="*{content}">

                <!-- DTO Validation 오류 -->
                <p th:if="${#fields.hasErrors('content')}"
                   th:errors="*{content}"
                   class="board-form-error">
                </p>

                <!-- TOAST UI 빈 본문 검사 오류 -->
                <p th:if="${contentError}"
                   th:text="${contentError}"
                   class="board-form-error">
                </p>

            </div>

            <!-- 하단 버튼 -->
            <div class="board-form-actions">

                <a th:href="@{/board/detail/{no}(no=${board.no})}"
                   class="board-button board-button-secondary">
                    취소
                </a>

                <button type="submit"
                        class="board-button board-button-primary">
                    수정 완료
                </button>

            </div>

        </form>

    </section>

</main>

<!-- 공통 하단 푸터 -->
<div data-global-footer></div>


<!-- 공통 헤더·푸터 관련 JS -->

<!-- banner.js에서 사용하는 상태와 공통 함수 -->
<script th:src="@{/js/index/state.js}"></script>
<script th:src="@{/js/index/utils.js}"></script>

<!-- 공통 헤더와 푸터 -->
<script th:src="@{/js/index/layout/banner.js}"></script>
<script th:src="@{/js/index/layout/footer.js}"></script>

<!-- 마이페이지 모달 -->
<script th:src="@{/js/common/address-search.js}"></script>
<script th:src="@{/js/mypage-modal.js}"></script>


<!-- TOAST UI Editor -->

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="https://uicdn.toast.com/editor/latest/i18n/ko-kr.js"></script>


<!-- 게시글 수정 에디터 -->

<script>
    /*
     * 기존 게시글 본문 또는
     * Validation 실패 후 입력했던 본문
     */
    const contentInput =
        document.querySelector("#content");

    const editorElement =
        document.querySelector("#editor");

    const updateForm =
        document.querySelector("#board-update-form");

    const savedContent =
        contentInput?.value || "";

    if (
        editorElement
        && contentInput
        && updateForm
        && typeof toastui !== "undefined"
    ) {
        const editor = new toastui.Editor({
            el: editorElement,
            height: "560px",
            initialEditType: "wysiwyg",
            previewStyle: "vertical",
            language: "ko-KR",
            initialValue: savedContent,

            hooks: {
                addImageBlobHook: async function (
                    blob,
                    callback
                ) {
                    const formData =
                        new FormData();

                    formData.append(
                        "image",
                        blob
                    );

                    try {
                        const response =
                            await fetch(
                                "/board/image/upload",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );

                        const result =
                            await response.json();

                        if (!response.ok) {
                            throw new Error(
                                result.message
                                || "이미지 업로드에 실패했습니다."
                            );
                        }

                        callback(
                            result.imageUrl,
                            blob.name
                            || "게시글 이미지"
                        );

                    } catch (error) {
                        alert(
                            error.message
                            || "이미지 업로드 중 오류가 발생했습니다."
                        );
                    }
                }
            }
        });

        /*
         * 수정 버튼을 누르면
         * 에디터 HTML을 hidden input에 저장
         */
        updateForm.addEventListener(
            "submit",
            function () {
                contentInput.value =
                    editor.getHTML();
            }
        );
    }
</script>

<script th:src="@{/js/cookie-consent.js}"></script>

<!-- 게시판 공통 레이아웃 실행 -->

<script th:src="@{/js/board/board-common-layout.js}"></script>


<!-- 쿠키 설정 -->
<script th:src="@{/js/cookie-consent.js}"></script>

</body>
</html>
