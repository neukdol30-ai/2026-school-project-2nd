<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>비회원 게시글 삭제</title>
</head>

<body>

<section class="guest-password-section">

    <h1>비회원 게시글 삭제</h1>

    <p>
        게시글을 삭제하려면 작성 시 입력한 비밀번호를 입력해주세요.
    </p>

    <form th:action="@{/board/guest/delete/{no}/verify(no=${board.no})}"
          method="post">

        <div class="form-group">

            <label for="guestPassword">
                비밀번호
            </label>

            <input type="password"
                   id="guestPassword"
                   name="guestPassword"
                   placeholder="비밀번호를 입력해주세요."
                   required>

            <p th:if="${passwordError != null}"
               th:text="${passwordError}"
               class="error-message">
            </p>

        </div>

        <div class="button-group">

            <a th:href="@{/board/detail/{no}(no=${board.no})}">
                취소
            </a>

            <button type="submit">
                비밀번호 확인
            </button>

        </div>

    </form>

</section>

</body>
</html>
