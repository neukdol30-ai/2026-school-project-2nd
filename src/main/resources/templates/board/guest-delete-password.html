<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>비회원 게시글 삭제</title>

    <!-- 기본 공통 CSS -->
    <link rel="stylesheet"
          th:href="@{/css/main.css}">

    <!-- 공통 헤더·푸터 디자인 -->
    <link rel="stylesheet"
          th:href="@{/css/index.css}">

    <!-- 마이페이지 모달 -->
    <link rel="stylesheet"
          th:href="@{/css/mypage-modal.css}">

    <!-- 쿠키 동의창 -->
    <link rel="stylesheet"
          th:href="@{/css/cookie-consent.css}">

    <!-- 게시판 CSS는 반드시 마지막 -->
    <link rel="stylesheet"
          th:href="@{/css/board.css}">
</head>

<body class="board-body">

<!-- 공통 상단 헤더 -->
<div class="global-banner-area">
    <div data-global-banner></div>
</div>


<!-- 비회원 게시글 삭제 비밀번호 확인 -->
<main class="board-page guest-password-page">

    <section class="guest-password-card">

        <!-- 상단 안내 영역 -->
        <header class="guest-password-header">

            <div class="guest-password-icon"
                 aria-hidden="true">
                !
            </div>

            <div>

                <h1 class="guest-password-title">
                    비회원 게시글 삭제
                </h1>

                <p class="guest-password-description">
                    게시글을 삭제하려면 작성할 때 입력한
                    비밀번호를 확인해야 합니다.
                </p>

            </div>

        </header>


        <!-- 삭제할 게시글 정보 -->
        <div class="guest-password-board-info">

            <span class="guest-password-info-label">
                삭제할 게시글
            </span>

            <strong class="guest-password-board-title"
                    th:text="${board.title}">
                게시글 제목
            </strong>

            <span class="guest-password-board-number"
                  th:text="'게시글 #' + ${board.no}">
                게시글 #1
            </span>

        </div>


        <!-- 비밀번호 확인 폼 -->
        <form th:action="@{/board/guest/delete/{no}/verify(no=${board.no})}"
              method="post"
              class="guest-password-form">

            <div class="guest-password-form-group">

                <label for="guestPassword"
                       class="guest-password-label">
                    비밀번호
                </label>

                <input id="guestPassword"
                       type="password"
                       name="guestPassword"
                       class="guest-password-input"
                       placeholder="작성 시 입력한 비밀번호"
                       autocomplete="current-password"
                       required
                       autofocus>

                <p class="guest-password-help">
                    비밀번호가 일치하면 삭제 확인 화면으로 이동합니다.
                </p>

                <p th:if="${passwordError != null}"
                   th:text="${passwordError}"
                   class="guest-password-error">
                    비밀번호가 일치하지 않습니다.
                </p>

            </div>


            <!-- 하단 버튼 -->
            <div class="guest-password-actions">

                <a th:href="@{/board/detail/{no}(no=${board.no})}"
                   class="guest-password-button guest-password-button-cancel">
                    취소
                </a>

                <button type="submit"
                        class="guest-password-button guest-password-button-delete">
                    비밀번호 확인
                </button>

            </div>

        </form>

    </section>

</main>


<!-- 공통 하단 푸터 -->
<div data-global-footer></div>


<!-- 공통 헤더·푸터 관련 JS -->

<!-- 공통 상태와 함수 -->

<script th:src="@{/js/index/state.js}"></script>
<script th:src="@{/js/index/utils.js}"></script>

<!-- 마이페이지 모달이 확인하는 로그인 위젯 함수 -->
<script th:src="@{/js/index/widgets/login.js}"></script>


<!-- 공통 헤더와 푸터 -->

<script th:src="@{/js/index/layout/banner.js}"></script>
<script th:src="@{/js/index/layout/footer.js}"></script>


<!-- 마이페이지 필수 모듈 -->

<script th:src="@{/js/mypage/mypage-config.js}"></script>
<script th:src="@{/js/mypage/mypage-utils.js}"></script>
<script th:src="@{/js/mypage/mypage-api.js}"></script>
<script th:src="@{/js/mypage/mypage-validation.js}"></script>
<script th:src="@{/js/mypage/mypage-renderer.js}"></script>

<script th:src="@{/js/common/address-search.js}"></script>

<!-- 위 모듈들이 모두 로드된 뒤 연결 -->
<script th:src="@{/js/mypage-modal.js}"></script>


<!-- 게시판 헤더·푸터 실행 -->
<script th:src="@{/js/board/board-common-layout.js}"></script>

<!-- 쿠키 동의창 -->
<script th:src="@{/js/cookie-consent.js}"></script>

</body>
</html>
