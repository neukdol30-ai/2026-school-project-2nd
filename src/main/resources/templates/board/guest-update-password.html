<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>비회원 게시글 수정</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>

<body>

<main class="guest-password-page">

    <section class="guest-password-card">

        <header class="guest-password-header">

            <div class="guest-password-icon">
                ✎
            </div>

            <div>

                <h1 class="guest-password-title">
                    비회원 게시글 수정
                </h1>

                <p class="guest-password-description">
                    게시글을 수정하려면 작성 당시 입력한
                    비밀번호를 입력해주세요.
                </p>

            </div>

        </header>

        <div class="guest-password-board-info">

            <span class="guest-password-info-label">
                수정할 게시글
            </span>

            <strong class="guest-password-board-title"
                    th:text="${board.title}">
            </strong>

            <span class="guest-password-board-number"
                  th:text="'게시글 #' + ${board.no}">
            </span>

        </div>

        <form
                th:action="@{/board/guest/update/{no}/verify(no=${board.no})}"
                method="post"
                class="guest-password-form">

            <div class="guest-password-form-group">

                <label class="guest-password-label">
                    비밀번호
                </label>

                <input
                        type="password"
                        name="guestPassword"
                        class="guest-password-input"
                        placeholder="작성 시 입력한 비밀번호"
                        required>

                <p class="guest-password-help">
                    비밀번호가 확인되면 수정 화면으로 이동합니다.
                </p>

                <p
                        th:if="${passwordError}"
                        th:text="${passwordError}"
                        class="guest-password-error">
                </p>

            </div>

            <div class="guest-password-actions">

                <a
                        th:href="@{/board/detail/{no}(no=${board.no})}"
                        class="guest-password-button guest-password-button-cancel">

                    취소

                </a>

                <button
                        class="guest-password-button guest-password-button-update">

                    비밀번호 확인

                </button>

            </div>

        </form>

    </section>

</main>

</body>
</html>
