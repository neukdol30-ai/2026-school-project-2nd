<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>게시글 삭제 확인</title>

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>

<body class="board-body">

<!-- 공통 상단 헤더 -->
<div class="global-banner-area">
    <div data-global-banner></div>
</div>

<main class="guest-delete-page">

    <section class="guest-delete-card">

        <div class="guest-delete-icon">
            🗑️
        </div>

        <h1 class="guest-delete-title">
            게시글을 삭제하시겠습니까?
        </h1>

        <p class="guest-delete-description">
            삭제한 게시글은 복구할 수 없습니다.
            <br>
            정말 삭제하시겠습니까?
        </p>

        <div class="guest-delete-board">

            <span>삭제 대상</span>

            <strong th:text="${board.title}">
                게시글 제목
            </strong>

        </div>

        <form
                th:action="@{/board/guest/delete/{no}(no=${board.no})}"
                method="post">

            <div class="guest-delete-buttons">

                <a
                        th:href="@{/board/detail/{no}(no=${board.no})}"
                        class="guest-delete-cancel">

                    취소

                </a>

                <button
                        type="submit"
                        class="guest-delete-submit">

                    삭제하기

                </button>

            </div>

        </form>

    </section>

</main>

<!-- 공통 하단 푸터 -->
<div data-global-footer></div>

</body>
</html>
