<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>게시글 삭제 확인</title>
</head>

<body>

<section class="guest-delete-section">

    <h1>게시글 삭제</h1>

    <p>
        정말 이 게시글을 삭제하시겠습니까?
    </p>

    <div class="delete-board-info">

        <p>
            제목:
            <strong th:text="${board.title}">
                게시글 제목
            </strong>
        </p>

        <p>
            작성자:
            <span th:text="${board.guestName}">
                비회원
            </span>
        </p>

    </div>

    <div class="button-group">

        <a th:href="@{/board/detail/{no}(no=${board.no})}">
            취소
        </a>

        <form th:action="@{/board/guest/delete/{no}(no=${board.no})}"
              method="post">

            <button type="submit">
                삭제하기
            </button>

        </form>

    </div>

</section>

</body>
</html>
