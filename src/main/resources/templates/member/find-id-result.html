<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기 결과</title>
    <link rel="stylesheet" th:href="@{/css/find-account.css}">
</head>
<body>

<div class="page-wrap">
    <div class="find-box">
        <h1 class="page-title">아이디 찾기 완료</h1>
        <p class="page-desc">인증이 확인되어 아래 아이디를 찾았습니다.</p>

        <div class="result-box">
            <!-- 일반 회원 : isSocialMember가 false일 때만 렌더링 -->
            <div th:if="${!isSocialMember}">
                <p class="result-label">회원님의 아이디</p>
                <p class="result-id" th:text="${resultMemberId}">honggildong</p>
            </div>

            <!-- 소셜 회원 : isSocialMember가 true일 때만 렌더링. 원본 memberId 대신 안내 문구 -->
            <div th:if="${isSocialMember}">
                <p class="result-label">가입 방법 안내</p>
                <p class="result-id" th:text="|${socialProviderName} 로그인으로 가입되어 있습니다.|">
                    카카오 로그인으로 가입되어 있습니다.
                </p>
            </div>
        </div>

        <p class="check-msg check-hint">
            이 화면은 한 번만 표시됩니다.<br>새로고침하면 다시 볼 수 없으니 아이디를 기억해 주세요.
        </p>

        <a th:href="@{/member/login}" class="submit-button">로그인하러 가기</a>

        <div class="bottom-link">
            <a th:href="@{/member/find-password}">비밀번호 찾기</a>
        </div>
    </div>
</div>
</body>
</html>
