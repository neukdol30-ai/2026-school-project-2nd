<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
</head>

<body>
<div class="page-wrap">
    <div class="signup-box">
        <h1 class="page-title">회원가입</h1>
        <form th:action="@{/member/signup}" th:object="${signupDto}" method="post">
            <!-- csrf hidden input 넣지 않음. -->

            <div th:if="${#fields.hasErrors('*')}" class="error-summary">
                <p>회원가입 입력값을 다시 확인하세요.</p>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="form-group"> <!-- 아이디 입력 영역 -->
                <label class="form-label" for="memberId">아이디</label> <!-- label의 for와 input의 id 연결 -->
                <input id="memberId" type="text" th:field="*{memberId}" class="form-input">
                <p class="error-message" th:errors="*{memberId}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input id="password" type="password" th:field="*{password}" class="form-input">
                <p class="error-message" th:errors="*{password}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="passwordCheck">비밀번호 확인</label>
                <input id="passwordCheck" type="password" th:field="*{passwordCheck}" class="form-input">
                <p class="error-message" th:errors="*{passwordCheck}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="name">이름</label>
                <input id="name" type="text" th:field="*{name}" class="form-input">
                <p class="error-message" th:errors="*{name}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="nickname">닉네임</label>
                <input id="nickname" type="text" th:field="*{nickname}" class="form-input">
                <p class="error-message" th:errors="*{nickname}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">이메일</label>
                <input id="email" type="email" th:field="*{email}" class="form-input">
                <p class="error-message" th:errors="*{email}"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="phone">전화번호</label>
                <input id="phone" type="text" th:field="*{phone}" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="birthDate">생년월일</label>
                <input id="birthDate" type="date" th:field="*{birthDate}" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="gender">성별</label>
                <select id="gender" th:field="*{gender}" class="form-select">
                    <option value="">선택 안 함</option>
                    <option value="M">남성</option>
                    <option value="F">여성</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="postcode">우편번호</label>
                <input id="postcode" type="text" th:field="*{postcode}" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="address">주소</label>
                <input id="address" type="text" th:field="*{address}" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="detailAddress">상세주소</label>
                <input id="detailAddress" type="text" th:field="*{detailAddress}" class="form-input">
            </div>

            <div class="check-group">
                <label class="check-group">
                    <input type="checkbox" th:field="*{agreeTermsYn}" value="Y" class="check-input">
                    <span>이용약관에 동의합니다.</span>
                </label>
                <p class="error-message" th:errors="*{agreeTermsYn}"></p>
            </div>

            <div class="check-group">
                <label class="check-group">
                    <input type="checkbox" th:field="*{agreePrivacyYn}" value="Y" class="check-input">
                    <span>개인정보 처리방침에 동의합니다.</span>
                </label>
                <p class="error-message" th:errors="*{agreePrivacyYn}"></p>
            </div>
            <button type="submit" class="submit-button">회원가입</button>
        </form>

        <div class="bottom-link">
            <a th:href="@{/member/login}">이미 계정이 있으면 로그인</a>
        </div>
    </div>
</div>

<script>
    // 아이디 중복확인을 했는지 저장
    let idChecked = false;

    // 중복확인 완료한 아이디 값 저장
    let checkedMemberId = "";

    // 아이디 입력칸
    const memberIdInput =
        document.getElementById("memberId");

    // 비밀번호 입력칸
    const password =
        document.getElementById("password");

    // 비밀번호 확인 입력칸
    const passwordCheck =
        document.getElementById("passwordCheck");


    // 아이디를 바꾸면 기존 중복확인 결과는 무효 처리
    memberIdInput.addEventListener("input", function () {
        idChecked = false;
        checkedMemberId = "";

        document.getElementById("checkResult").innerText = "";
    });


    // 아이디 중복확인
    function idCheck() {

        // 사용자가 입력한 아이디 앞뒤 공백 제거
        const memberId =
            memberIdInput.value.trim();

        // 중복확인 결과를 보여줄 위치
        const result =
            document.getElementById("checkResult");

        // 아이디가 비어있으면 요청 보내지 않음
        if (memberId === "") {
            result.style.color = "red";
            result.innerText = "아이디를 입력해주세요.";
            return;
        }

        // 서버에 아이디 중복확인 요청
        fetch("/member/id-check?memberId=" + encodeURIComponent(memberId))
            .then(response => response.json())
            .then(data => {

                // 이미 사용 중인 아이디일 때
                if (data.isDuplicate) {

                    idChecked = false;
                    checkedMemberId = "";

                    result.style.color = "red";
                    result.innerText =
                        "이미 사용 중인 아이디입니다.";

                }

                // 사용 가능한 아이디일 때
                else {

                    idChecked = true;
                    checkedMemberId = memberId;

                    result.style.color = "blue";
                    result.innerText =
                        "사용 가능한 아이디입니다.";
                }
            })
            .catch(error => {

                // 중복확인 요청 자체가 실패했을 때
                idChecked = false;
                checkedMemberId = "";

                result.style.color = "red";
                result.innerText =
                    "중복확인 중 오류가 발생했습니다.";
            });
    }


    // 비밀번호 규칙 검사 함수
    function checkPasswordRule() {

        // 8자 이상 + 영문 포함 + 숫자 포함
        const regex =
            /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

        // 비밀번호 규칙 결과를 보여줄 위치
        const result =
            document.getElementById("passwordRule");

        // 비밀번호칸이 비어있으면 메시지 제거
        if (password.value.trim() === "") {
            result.innerText = "";
            return;
        }

        // 비밀번호 규칙 통과
        if (regex.test(password.value)) {

            result.style.color = "blue";
            result.innerText =
                "사용 가능한 비밀번호입니다.";

        }

        // 비밀번호 규칙 실패
        else {

            result.style.color = "red";
            result.innerText =
                "8자 이상, 영문과 숫자를 포함해야 합니다.";
        }
    }


    // 비밀번호 확인 검사 함수
    function checkPasswordMatch() {

        // 비밀번호 일치 여부 결과를 보여줄 위치
        const result =
            document.getElementById("pwResult");

        // 비밀번호나 비밀번호 확인 중 하나라도 비어있으면 메시지 제거
        if (password.value.trim() === "" || passwordCheck.value.trim() === "") {
            result.innerText = "";
            return;
        }

        // 둘 다 값이 있을 때만 비교
        if (password.value === passwordCheck.value) {

            result.style.color = "blue";
            result.innerText =
                "비밀번호가 일치합니다.";

        }

        // 값이 다르면 불일치 표시
        else {

            result.style.color = "red";
            result.innerText =
                "비밀번호가 일치하지 않습니다.";
        }
    }


    // 비밀번호칸을 입력/수정할 때 실행
    password.addEventListener("input", function () {

        // 비밀번호 규칙 다시 검사
        checkPasswordRule();

        // 비밀번호 확인칸과도 다시 비교
        checkPasswordMatch();
    });


    // 비밀번호 확인칸을 입력/수정할 때 실행
    passwordCheck.addEventListener("input", function () {

        // 비밀번호와 비밀번호 확인 비교
        checkPasswordMatch();
    });


    // 최종 제출 전 검사
    function validateForm() {

        // 현재 입력된 아이디
        const memberId =
            memberIdInput.value.trim();

        // 현재 입력된 비밀번호
        const pw =
            password.value;

        // 현재 입력된 비밀번호 확인
        const pwCheck =
            passwordCheck.value;

        // 서버와 같은 기준으로 비밀번호 최종 검사
        const regex =
            /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

        // 중복확인을 안 했거나, 중복확인 후 아이디를 바꿨으면 막기
        if (!idChecked || checkedMemberId !== memberId) {
            alert("아이디 중복확인을 해주세요.");
            return false;
        }

        // 비밀번호 규칙 검사
        if (!regex.test(pw)) {
            alert("비밀번호는 8자 이상, 영문과 숫자를 포함해야 합니다.");
            return false;
        }

        // 비밀번호 확인 검사
        if (pw !== pwCheck) {
            alert("비밀번호 확인이 일치하지 않습니다.");
            return false;
        }

        // 이용약관 동의 검사
        if (!document.getElementById("agreeTermsYn").checked) {
            alert("이용약관에 동의해주세요.");
            return false;
        }

        // 개인정보 처리방침 동의 검사
        if (!document.getElementById("agreePrivacyYn").checked) {
            alert("개인정보 처리방침에 동의해주세요.");
            return false;
        }

        // 모든 검사 통과하면 회원가입 요청 진행
        return true;
    }
</script>

</body>
</html>
