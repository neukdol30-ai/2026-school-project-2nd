<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const storedTheme =
                    localStorage.getItem("portalTheme")
                    || localStorage.getItem("calendar-theme");

                const theme =
                    storedTheme === "dark"
                        ? "dark"
                        : "light";

                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <link rel="stylesheet" th:href="@{/css/cookie-consent.css}">
    <link rel="stylesheet" href="/css/theme.css?v=20260729-12">
</head>

<body class="auth-page auth-signup-page">
<div class="page-wrap">
    <div class="signup-box">
        <h1 class="page-title">회원가입</h1>

        <form th:action="@{/member/signup}" th:object="${signupDto}" method="post">
            <!-- csrf hidden 없음 (SecurityConfig에서 csrf.disable() 상태라 불필요) -->

            <!--서버 검증에서 걸린 오류 -> 폼 상단에 모아서 표시하기-->
            <div th:if="${#fields.hasErrors('*')}" class="error-summary">
                <p>회원가입 입력값을 다시 확인하세요.</p>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <!-- 필수 1 : 아이디 -->
            <div class="form-group">
                <label class="form-label" for="memberId">아이디 <span class="required">*</span></label>
                <!-- label의 for와 input의 id 연결 -->
                <input id="memberId" type="text" th:field="*{memberId}" class="form-input"
                       required minlength="4" maxlength="20"
                       placeholder="4~20자">
                <p class="error-message" th:errors="*{memberId}"></p> <!-- 서버가 준 오류 표시 자리 -->
                <span id="memberIdCheck" class="check-msg"></span> <!-- 아이디 중복 체크 결과 메시지 자리(JS가 채움) -->
            </div>
            <!-- 필수 2 : 비밀번호 -->
            <div class="form-group">
                <label class="form-label" for="password">비밀번호 <span class="required">*</span></label>

                <!-- input과 눈 버튼을 겹쳐 놓기 위한 div -->
                <div class="input-wrap">
                    <!-- pattern : 대, 소문자 / 숫자 각 1개 이상 포함 + 8~20자여야 제출. / title : 안 맞을 때 안내 문구 -->
                    <input id="password" type="password" th:field="*{password}" class="form-input has-eye"
                           required
                           maxlength="20"
                           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,20}"
                           title="영문 대문자·소문자·숫자를 모두 포함해 8~20자로 입력하세요."
                           placeholder="영문 대/소문자 + 숫자 조합 8~20자">
                    <button type="button" class="eye-btn" data-target="password" aria-label="비밀번호 표시"></button>
                </div>

                <p class="error-message" th:errors="*{password}"></p>

                <!-- 비밀번호 조건 실시간 체크리스트. 처음엔 전부 회색(도움말), 조건을 만족하면 초록 ✓로 변경 -->
                <ul class="rule-list" id="pwRules">
                    <li class="rule-item" data-rule="len">8~20자</li>
                    <li class="rule-item" data-rule="upper">영문 대문자 포함</li>
                    <li class="rule-item" data-rule="lower">영문 소문자 포함</li>
                    <li class="rule-item" data-rule="digit">숫자 포함</li>
                </ul>
            </div>

            <!-- 필수 3 : 비밀번호 확인 -->
            <div class="form-group">
                <label class="form-label" for="passwordCheck">비밀번호 확인 <span class="required">*</span></label>
                <div class="input-wrap">
                    <input id="passwordCheck" type="password" th:field="*{passwordCheck}" class="form-input has-eye"
                           required
                           maxlength="20"
                           placeholder="위에 입력한 비밀번호를 한 번 더">
                    <button type="button" class="eye-btn" data-target="passwordCheck" aria-label="비밀번호 표시"></button>
                </div>
                <p class="error-message" th:errors="*{passwordCheck}"></p>
                <span id="pwCheck" class="check-msg"></span> <!-- 두 칸 일치 여부 메시지 자리 -->
            </div>

            <!-- 필수 4 : 이름 -->
            <div class="form-group">
                <label class="form-label" for="name">이름 <span class="required">*</span></label>
                <input id="name" type="text" th:field="*{name}" class="form-input"
                       required minlength="2" maxlength="20"
                       placeholder="2~20자">
                <p class="error-message" th:errors="*{name}"></p>
                <span id="nameHint" class="check-msg"></span> <!-- 이름 길이 실시간 안내 자리 -->
            </div>

            <!-- 필수 5 : 닉네임 (DB NOT NULL이라 반드시 필수) -->
            <div class="form-group">
                <label class="form-label" for="nickname">닉네임 <span class="required">*</span></label>
                <input id="nickname" type="text" th:field="*{nickname}" class="form-input"
                       required minlength="2" maxlength="10"
                       placeholder="2~10자">
                <p class="error-message" th:errors="*{nickname}"></p>
                <span id="nicknameCheck" class="check-msg"></span> <!-- 닉네임 중복 체크 결과 메시지 자리(JS가 채움) -->
            </div>

            <!-- 필수 6 : 이메일 (신규 추가) -->
            <div>
                <label class="form-label" for="email">이메일 <span class="required">*</span></label>
                <!-- postcode-wrap : 원래 우편번호 검색용 클래스 -> "입력칸+버튼 가로배치" 필요해서 그대로 재사용 -->
                <div class="postcode-wrap">
                    <input id="email" type="email" th:field="*{email}" class="form-input" required
                           placeholder="example@domain.com">
                    <button type="button" id="sendCodeBtn" class="postcode-btn">인증번호 발송</button>
                </div>
                <p class="error-message" th:errors="*{email}"></p>
                <span id="emailHint" class="check-msg"></span> <!-- 이메일 형식 실시간 안내 + 발송 결과 메시지 겸용 -->
                <a href="#" id="changeEmailLink" class="change-email-link" style="display: none;">이메일을 잘못 입력했나요? 다시 입력하기</a>
            </div>

            <!-- 이메일 인증번호 (처음엔 숨김 / 발송 성공 시 JS가 보이게 함) 신규 추가 -->
            <div class="form-group" id="emailCodeGroup" style="display: none;">
                <label class="form-label" for="emailCode">이메일 인증 번호 <span class="required">*</span></label>
                <div class="postcode-wrap">
                    <input id="emailCode" type="text" class="form-input" placeholder="6자리 숫자" maxlength="6">
                    <button type="button" id="verifyCodeBtn" class="postcode-btn">인증 확인</button>
                </div>
                <span id="verifyCodeMsg" class="check-msg"></span>
            </div>

            <!-- 선택 항목들 -->
            <div class="form-group">
                <label class="form-label" for="phone">전화번호</label>
                <!-- maxlength="13" : 하이픈 2개 포함해서 010-0000-0000 = 정확히 13자 -->
                <input id="phone" type="text" th:field="*{phone}" class="form-input"
                       maxlength="13"
                       placeholder="010-0000-0000">
                <span id="phoneHint" class="check-msg"></span> <!-- 전화번호 형식 실시간 안내 자리-->
            </div>

            <!-- 캘린더 팝업 대신 숫자 8자리 직접 입력 + JS 자동 포맷 -->
            <div class="form-group">
                <label class="form-label" for="birthDate">생년월일</label>
                <!-- maxlength="10" : 하이픈 2개 포함해서 2000-03-06 = 정확히 10자 -->
                <input id="birthDate" type="text" th:field="*{birthDate}" class="form-input"
                       maxlength="10"
                       placeholder="생년월일 8자리 (예: 20000306)">
                <p class="error-message" th:errors="*{birthDate}"></p> <!-- 서버 검증(미래 날짜/14세 미만) 오류 표시 자리 -->
                <span id="birthDateHint" class="check-msg"></span> <!-- 실시간 안내 메시지 자리(JS가 채움) -->
            </div>

            <div class="form-group">
                <label class="form-label" for="gender">성별</label>
                <select id="gender" th:field="*{gender}" class="form-select">
                    <option value="">선택 안 함</option>
                    <option value="M">남성</option>
                    <option value="F">여성</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="postcode">우편번호</label>
                <div class="postcode-wrap"> <!-- 입력칸과 버튼을 가로로 나란히 배치하기 위한 div -->
                    <!-- readonly : 사용자 직접 타이핑 X -> JS가 채워 넣은 값만 표시. -->
                    <input id="postcode" type="text" th:field="*{postcode}" class="form-input" readonly
                           placeholder="주소 검색 버튼을 눌러주세요">
                    <button type="button" id="postcodeSearchBtn" class="postcode-btn">주소 검색</button>
                </div>
            </div>

            <!-- 주소 -> readonly (검색 팝업 결과로만 채워짐) -->
            <div class="form-group">
                <label class="form-label" for="address">주소</label>
                <input id="address" type="text" th:field="*{address}" class="form-input" readonly>
            </div>

            <div class="form-group">
                <label class="form-label" for="detailAddress">상세주소</label>
                <input id="detailAddress" type="text" th:field="*{detailAddress}" class="form-input">
            </div>

            <!-- 필수 7 : 이용약관 동의 영역 -->
            <div class="check-group">

                <div class="check-row">
                    <label class="check-label">
                        <input type="checkbox"
                               th:field="*{agreeTermsYn}"
                               value="Y"
                               class="check-input"
                               required>
                        <span>
                            이용약관에 동의합니다.
                            <span class="required">*</span>
                        </span>
                    </label>

                    <a th:href="@{/member/terms}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="policy-link">
                        내용 보기
                    </a>
                </div>

                <p class="error-message"
                   th:errors="*{agreeTermsYn}">
                </p>
            </div>

            <!-- 필수 8 : 개인정보 수집 및 이용 동의 영역 -->
            <div class="check-group">

                <div class="check-row">

                    <label class="check-label">

                        <input type="checkbox"
                               th:field="*{agreePrivacyYn}"
                               value="Y"
                               class="check-input"
                               required>

                        <!-- 개인정보 수집·이용 동의 문구입니다 -->
                        <span>
                            개인정보 수집 및 이용에 동의합니다.
                            <span class="required">*</span>
                        </span>
                    </label>

                    <a th:href="@{/member/privacy}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="policy-link">
                        내용 보기
                    </a>
                </div>

                <p class="error-message"
                   th:errors="*{agreePrivacyYn}">
                </p>
            </div>

            <button type="submit" class="submit-button">회원가입</button>
        </form>

        <div class="bottom-link">
            <a th:href="@{/member/login}">이미 계정이 있으면 로그인</a>
        </div>
    </div>
</div>

<script src="/js/theme.js?v=20260729-3"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script th:src="@{/js/signup.js}"></script>
<script th:src="@{/js/cookie-consent.js}"></script>
</body>
</html>
