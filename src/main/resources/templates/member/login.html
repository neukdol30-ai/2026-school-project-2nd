<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        .page-wrap {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 16px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            margin: 0 0 28px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
        }

        .message-box {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .message-success {
            background-color: #e7f6ec;
            border: 1px solid #b7e0c2;
            color: #176b35;
        }

        .message-error {
            background-color: #fdecec;
            border: 1px solid #f2b8b5;
            color: #b42318;
        }

        .message-info {
            background-color: #eef4ff;
            border: 1px solid #b8cdf8;
            color: #234b91;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-input-focus {
            border-color: #333;
        }

        .submit-button {
            width: 100%;
            height: 46px;
            margin-top: 8px;
            border: none;
            border-radius: 6px;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background-color: #444;
        }

        .bottom-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .bottom-link a {
            color: #222;
            font-weight: 700;
            text-decoration: none;
        }

        .bottom-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="page-wrap">
    <div class="login-box">
        <h1 class="page-title">로그인</h1>

        <div th:if="${param.signup}" class="message-box message-success">
            회원가입이 완료되었습니다. 로그인하세요.
        </div>

        <div th:if="${param.error}" class="message-box message-error">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>

        <div th:if="${param.logout}" class="message-box message-info">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/member/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="memberId">아이디</label>
                <input id="memberId" type="text" name="memberId" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input id="password" type="password" name="password" class="form-input">
            </div>

            <button type="submit" class="submit-button">로그인</button>
        </form>

        <div class="bottom-link">
            <a th:href="@{/member/signup}">회원가입</a>
        </div>
    </div>
</div>
</body>
</html>
