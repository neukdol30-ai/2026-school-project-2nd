<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="page-wrap">
    <div class="login-box">
        <h1 class="page-title">로그인</h1>

        <div th:if="${param.signup}" class="message-box message-success">
            회원가입이 완료되었습니다. 로그인하세요.
        </div>

        <div th:if="${param.error}" class="message-box message-error">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>

        <div th:if="${param.logout}" class="message-box message-info">
            로그아웃되었습니다.
        </div>

        <form th:action="@{/member/login}" method="post">
            <div class="form-group">
                <label class="form-label" for="memberId">아이디</label>
                <input id="memberId" type="text" name="memberId" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">비밀번호</label>
                <input id="password" type="password" name="password" class="form-input">
            </div>

            <button type="submit" class="submit-button">로그인</button>
        </form>

        <div class="bottom-link">
            <a th:href="@{/member/signup}">회원가입</a>
        </div>
    </div>
</div>

</body>
</html>
