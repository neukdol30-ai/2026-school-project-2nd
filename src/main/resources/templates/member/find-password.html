<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/css/find-account.css}">
</head>
<body>

<div class="page-wrap">
    <div class="find-box">

        <h1 class="page-title">비밀번호 찾기</h1>

        <p class="page-desc">가입하신 아이디와 이메일을 함께 입력해 주세요.</p>

        <!-- 아이디 입력 그룹 (find-id.html에는 없었음) -->
        <div class="form-group">
            <label class="form-label" for="memberId">아이디</label>

            <div class="input-row">
                <input id="memberId" type="text" class="form-input" placeholder="아이디를 입력하세요">
            </div>

            <span id="memberIdMsg" class="check-msg"></span> <!-- JS의 setMsg()가 이 칸의 글자와 색을 바꿈. -->
        </div>

        <!-- 이메일 + 인증번호 발송 버튼 (find-id.html과 같은 구조 -- 화면 간 일관성 유지) -->
        <div class="form-group">
            <label class="form-label" for="email">이메일</label>

            <div class="input-row">
                <input id="email" type="email" class="form-input" placeholder="example@domain.com">

                <button type="button" id="sendBtn" class="side-button">인증번호 발송</button>
            </div>

            <span id="sendMsg" class="check-msg"></span>
            <a href="#" id="changeEmailLink" class="change-email-link" style="display: none;">아이디/이메일을 잘못 입력했나요? 다시 입력하기</a>
        </div>

        <!-- 인증번호 입력 그룹 (처음엔 숨김) / JS가 발송 성공 응답을 받은 순간 보임 -->
        <div class="form-group" id="codeGroup" style="display: none;">
            <label class="form-label" for="code">인증번호</label>

            <div class="input-row">
                <input id="code" type="text" class="form-input" placeholder="6자리 숫자" maxlength="6">

                <button type="button" id="verifyBtn" class="side-button">인증 확인</button>
            </div>

            <span id="verifyMsg" class="check-msg"></span>
        </div>

        <!-- 하단 보조 링크 -->
        <div class="bottom-link">
            <a th:href="@{/member/login}">로그인으로 돌아가기</a>
            &nbsp;|&nbsp;
            <a th:href="@{/member/find-id}">아이디 찾기</a>
        </div>

    </div>
</div>

<script th:src="@{/js/find-password.js}"></script>
</body>
</html>
