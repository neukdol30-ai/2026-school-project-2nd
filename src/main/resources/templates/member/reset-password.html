<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const storedTheme =
                    localStorage.getItem("portalTheme")
                    || localStorage.getItem("calendar-theme");

                const theme =
                    storedTheme === "dark"
                        ? "dark"
                        : "light";

                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = "light";
            }
        })();
    </script>
    <title>비밀번호 재설정</title>
    <link rel="stylesheet" th:href="@{/css/find-account.css}">
    <link rel="stylesheet" href="/css/theme.css?v=20260729-12">
</head>
<body class="auth-page auth-find-page">

<div class="page-wrap">
    <div class="find-box">

        <h1 class="page-title">비밀번호 재설정</h1>
        <p class="page-desc">새로 사용할 비밀번호를 입력해 주세요.</p>

        <!-- 화면(JS) 검사를 통과해도 이 메시지 나올 수 있음. -> F12로 JS를 우회해 보내는 경우. -> 서버 검사가 진짜 방어선. 이 자리 반드시 있어야 함. -->
        <div th:if="${resetPasswordError}" class="error-summary" th:text="${resetPasswordError}">
            서버 오류 메시지가 여기에 표시됩니다.
        </div>

        <!-- 비밀번호 변경 폼 -->
        <form id="resetForm" th:action="@{/member/reset-password}" method="post" autocomplete="off">

            <!-- 새 비밀번호 -->
            <div class="form-group">
                <label class="form-label" for="newPassword">새 비밀번호</label>

                <div class="input-wrap">
                    <input id="newPassword"
                           name="newPassword"
                           type="password"
                           class="form-input has-eye"
                           placeholder="새 비밀번호"
                           required>
                    <button type="button" class="eye-btn" data-target="newPassword" aria-label="비밀번호 표시"></button>
                </div>

                <!-- 비밀번호 조건 실시간 체크리스트 -->
                <ul id="pwRules" class="rule-list">
                    <li class="rule-item" data-rule="len">8자 이상 20자 이하</li>
                    <li class="rule-item" data-rule="upper">영문 대문자 포함</li>
                    <li class="rule-item" data-rule="lower">영문 소문자 포함</li>
                    <li class="rule-item" data-rule="digit">숫자 포함</li>
                </ul>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label class="form-label" for="newPasswordCheck">비밀번호 확인</label>

                <div class="input-wrap">
                    <!-- MemberController의 @RequestParam("newPasswordCheck")와 name이 일치해야 한다. -->
                    <input id="newPasswordCheck"
                           name="newPasswordCheck"
                           type="password"
                           class="form-input has-eye"
                           placeholder="비밀번호 확인"
                           required>

                    <button type="button" class="eye-btn" data-target="newPasswordCheck" aria-label="비밀번호 표시"></button>
                </div>

                <!-- 두 칸이 같은지 실시간으로 알려줄 자리. JS의 setMsg()가 글자와 색을 넣음. -->
                <span id="pwCheckMsg" class="check-msg"></span>
            </div>

            <button type="submit" id="submitBtn" class="submit-button">비밀번호 변경</button>
        </form>

        <div class="bottom-link">
            <a th:href="@{/member/login}">로그인으로 돌아가기</a>
        </div>

    </div>
</div>

<script src="/js/theme.js?v=20260729-3"></script>
<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
