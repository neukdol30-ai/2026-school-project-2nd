<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="boardDetailView" class="admin-view" th:classappend="${activeView == 'boardDetail'} ? ' active' : ''" id="boardDetailView">
    <article class="panel full-panel" th:if="${boardDetail != null}">
        <div class="panel-head with-actions">
            <div>
                <span class="eyebrow">Board Detail</span>
                <h2>게시글 상세</h2>
                <p>관리자 콘솔 안에서 게시글 원문과 답변을 확인합니다.</p>
            </div>
            <div class="toolbar-actions">
                <a th:href="@{/admin(view='boards')}" class="small-link">목록으로</a>
                <button type="button"
                        class="danger-button"
                        data-board-delete-button
                        th:attr="data-board-no=${boardDetail.no}">
                    게시글 삭제
                </button>
            </div>
        </div>

        <section class="admin-board-detail-card">
            <div class="admin-board-detail-meta">
                <span class="status-tag" th:text="${boardDetail.categoryName}">문의게시글</span>
                <span class="status-tag" th:classappend="${boardDetail.answerStatus == 'ANSWERED'} ? ' active' : ''" th:text="${boardDetail.answerStatusName}">답변 대기</span>
                <span th:text="'게시글 #' + ${boardDetail.no}">게시글 #1</span>
                <span th:text="'조회 ' + ${boardDetail.viewCount}">조회 0</span>
                <span th:text="${boardDetail.createdDate != null ? #temporals.format(boardDetail.createdDate, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
            </div>

            <h3 th:text="${boardDetail.title}">게시글 제목</h3>

            <div class="admin-board-writer">
                <strong>작성자</strong>
                <span th:text="${boardDetail.displayWriter}">작성자</span>
            </div>

            <div class="admin-board-content" th:utext="${boardDetail.content}">
                게시글 내용
            </div>
        </section>

        <section class="admin-board-comment-section">
            <div class="panel-head compact-head">
                <div>
                    <span class="eyebrow">Answers</span>
                    <h2 th:text="'답변 ' + (${boardCommentList != null ? #lists.size(boardCommentList) : 0}) + '건'">답변 0건</h2>
                </div>
            </div>

            <div class="admin-board-comment-list" th:if="${boardCommentList != null and !#lists.isEmpty(boardCommentList)}">
                <article class="admin-board-comment-card" th:each="comment : ${boardCommentList}">
                    <div class="comment-avatar">A</div>
                    <div class="comment-body">
                        <div class="comment-meta">
                            <strong th:text="${comment.writerNickname != null and !#strings.isEmpty(comment.writerNickname) ? comment.writerNickname : '탈퇴회원'}">작성자</strong>
                            <span th:text="${comment.createdDate != null ? #temporals.format(comment.createdDate, 'yyyy-MM-dd HH:mm') : '-'}">-</span>
                        </div>
                        <div class="comment-content" th:utext="${comment.content}">답변 내용</div>
                    </div>
                </article>
            </div>

            <div class="empty-box" th:if="${boardCommentList == null or #lists.isEmpty(boardCommentList)}">
                <strong>등록된 답변이 없습니다.</strong>
                <p>답변이 작성되면 이 영역에 표시됩니다.</p>
            </div>
        </section>
    </article>

    <article class="panel full-panel" th:if="${boardDetail == null}">
        <div class="empty-box">
            <strong>게시글을 찾을 수 없습니다.</strong>
            <p>삭제되었거나 존재하지 않는 게시글입니다.</p>
            <a th:href="@{/admin(view='boards')}" class="small-link">게시글 목록으로</a>
        </div>
    </article>
</section>
</body>
</html>
