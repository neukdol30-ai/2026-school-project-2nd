<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 외부 서비스 설정 상태 영역: 보안을 위해 API 키·토큰의 실제 값은 출력하지 않습니다. -->
<section th:fragment="serviceManageView"
         class="admin-view"
         th:classappend="${activeView == 'services'} ? ' active' : ''"
         id="serviceManageView">
    <article class="panel full-panel">
        <div class="panel-head">
            <div>
                <span class="eyebrow">External Services</span>
                <h2>외부 서비스 상태</h2>
                <p>
                    현재 서버에 필요한 API 키·토큰이 등록되어 있는지 확인합니다.
                    외부 서버를 실시간 호출하지 않으므로 장애 여부나 잔여 쿼터는 각 서비스 콘솔에서 확인해야 합니다.
                </p>
            </div>
        </div>

        <div class="service-list">
            <div class="service-card"
                 th:each="service : ${dashboard.serviceStatusList}"
                 th:classappend="${service.available} ? ' available' : ' pending'">
                <div>
                    <strong th:text="${service.serviceName}">서비스명</strong>
                    <p th:text="${service.description}">서비스 설명</p>
                </div>
                <span th:text="${service.status}">상태</span>
            </div>
        </div>
    </article>
</section>
</body>
</html>
