<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="boardFormView"
         class="admin-view"
         th:classappend="${activeView == 'boardCreate' or activeView == 'boardEdit'} ? ' active' : ''"
         id="boardFormView">
    <article class="panel full-panel" th:if="${activeView == 'boardCreate' or boardForm != null}">
        <div class="panel-head with-actions">
            <div>
                <span class="eyebrow" th:text="${activeView == 'boardCreate'} ? 'Board Create' : 'Board Edit'">Board Form</span>
                <h2 th:text="${activeView == 'boardCreate'} ? '게시글 등록' : '게시글 수정'">게시글 등록</h2>
                <p>관리자 콘솔 안에서 게시글을 등록하거나 수정합니다.</p>
            </div>
            <div class="toolbar-actions">
                <a th:href="@{/admin(view='boards')}" class="small-link">목록으로</a>
                <a th:if="${activeView == 'boardEdit' and boardForm != null}"
                   th:href="@{/admin/boards/{no}(no=${boardForm.no})}"
                   class="small-link">상세보기</a>
            </div>
        </div>

        <form class="admin-edit-form admin-board-form"
              method="post"
              th:action="@{/admin/boards/save}">
            <input type="hidden" name="no" th:value="${boardForm != null ? boardForm.no : ''}">
            <section class="edit-summary-card">
                <div class="profile-avatar">📝</div>
                <div>
                    <strong th:text="${activeView == 'boardCreate'} ? '새 게시글 작성' : ${boardForm.title}">새 게시글 작성</strong>
                    <span th:text="${activeView == 'boardCreate'} ? '관리자 권한으로 게시글을 등록합니다.' : '게시글 번호 #' + ${boardForm.no}">관리자 권한으로 게시글을 등록합니다.</span>
                </div>
            </section>

            <div class="admin-form-grid">
                <label>
                    <span>카테고리</span>
                    <select name="category">
                        <option value="QUESTION" th:selected="${boardForm == null or boardForm.category == null or boardForm.category == 'QUESTION'}">문의게시글</option>
                        <option value="NOTICE" th:selected="${boardForm != null and boardForm.category == 'NOTICE'}">공지사항</option>
                    </select>
                </label>

                <label>
                    <span>답변 상태</span>
                    <select name="answerStatus">
                        <option value="WAITING" th:selected="${boardForm == null or boardForm.answerStatus == null or boardForm.answerStatus == 'WAITING'}">답변 대기</option>
                        <option value="ANSWERED" th:selected="${boardForm != null and boardForm.answerStatus == 'ANSWERED'}">답변 완료</option>
                    </select>
                </label>

                <label class="wide-field">
                    <span>제목</span>
                    <input type="text"
                           name="title"
                           maxlength="200"
                           required
                           th:value="${boardForm != null ? boardForm.title : ''}"
                           placeholder="게시글 제목을 입력해 주세요.">
                </label>

                <label class="wide-field board-content-field">
                    <span>내용</span>
                    <textarea name="content"
                              required
                              rows="18"
                              placeholder="게시글 내용을 입력해 주세요."
                              th:text="${boardForm != null ? boardForm.content : ''}"></textarea>
                    <small>HTML 내용을 그대로 저장할 수 있습니다. 사용자 화면에서는 기존 게시글 상세 방식으로 표시됩니다.</small>
                </label>
            </div>

            <div class="form-actions-row">
                <a th:href="@{/admin(view='boards')}" class="form-link-button">취소</a>
                <button type="submit" class="primary-button" th:text="${activeView == 'boardCreate'} ? '등록하기' : '수정 저장'">저장</button>
            </div>
        </form>
    </article>

    <article class="panel full-panel" th:if="${activeView == 'boardEdit' and boardForm == null}">
        <div class="empty-box">
            <strong>수정할 게시글을 찾을 수 없습니다.</strong>
            <p>삭제되었거나 존재하지 않는 게시글입니다.</p>
            <a th:href="@{/admin(view='boards')}" class="small-link">게시글 목록으로</a>
        </div>
    </article>
</section>
</body>
</html>
