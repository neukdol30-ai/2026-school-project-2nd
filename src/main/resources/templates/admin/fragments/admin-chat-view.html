<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 상담 관리 영역: /admin 내부에서 표시됩니다. -->
        <section th:fragment="chatManageView" class="admin-view" th:classappend="${activeView == 'chats'} ? ' active' : ''" id="chatManageView"
                 th:attr="data-active-view=${activeView},
                          data-chat-status=${chatStatus},
                          data-chat-category=${chatCategory},
                          data-chat-keyword=${chatKeyword},
                          data-chat-page=${chatPage},
                          data-chat-size=${chatSize}">
            <article class="panel full-panel">
                <div class="panel-head with-actions">
                    <div>
                        <span class="eyebrow">Chat Management</span>
                        <h2>상담 관리</h2>
                        <p>별도 페이지 이동 없이 관리자 콘솔 안에서 상담 목록을 검색하고 확인합니다.</p>
                    </div>
                    <div class="panel-actions">
                        <div class="chat-live-status" id="adminChatLiveStatus">
                            <span></span>
                            <strong>실시간 연결 대기</strong>
                        </div>
                        <button type="button" class="small-link notification-toggle" data-admin-notification-button>🔔 브라우저 알림 켜기</button>
                        <a th:href="@{/admin(view='dashboard')}" class="small-link">대시보드</a>
                    </div>
                </div>

                <form class="admin-filter-form" th:action="@{/admin}" method="get">
                    <input type="hidden" name="view" value="chats">
                    <input type="hidden" name="chatSize" th:value="${chatSize}">
                    <select name="chatStatus">
                        <option value="" th:selected="${#strings.isEmpty(chatStatus)}">전체 상태</option>
                        <option value="OPEN" th:selected="${chatStatus == 'OPEN'}">진행 중</option>
                        <option value="CLOSED" th:selected="${chatStatus == 'CLOSED'}">종료</option>
                    </select>
                    <select name="chatCategory">
                        <option value="" th:selected="${#strings.isEmpty(chatCategory)}">전체 카테고리</option>
                        <option value="MAIL" th:selected="${chatCategory == 'MAIL'}">메일 문의</option>
                        <option value="MAP" th:selected="${chatCategory == 'MAP'}">지도 문의</option>
                        <option value="STOCK" th:selected="${chatCategory == 'STOCK'}">증권 문의</option>
                        <option value="NEWS" th:selected="${chatCategory == 'NEWS'}">뉴스 문의</option>
                        <option value="WEATHER" th:selected="${chatCategory == 'WEATHER'}">날씨 문의</option>
                        <option value="CALENDAR" th:selected="${chatCategory == 'CALENDAR'}">캘린더 문의</option>
                        <option value="ETC" th:selected="${chatCategory == 'ETC'}">기타 문의</option>
                    </select>
                    <input type="text" name="chatKeyword" th:value="${chatKeyword}" placeholder="방 번호, 닉네임, 최근 메시지 검색">
                    <button type="submit">검색</button>
                    <a th:href="@{/admin(view='chats')}" class="reset-link">초기화</a>
                </form>

                <div class="table-toolbar">
                    <div>
                        <strong id="adminChatResultCount" th:text="'검색 결과 ' + ${chatTotalCount} + '건'">검색 결과 0건</strong>
                        <span id="selectedChatCount">선택 0건</span>
                    </div>
                    <div class="toolbar-actions">
                        <span class="realtime-hint" id="adminChatRealtimeMessage">실시간 알림 대기 중</span>
                        <button type="button" class="ghost-button" id="selectAllChats">전체선택</button>
                        <button type="button" class="ghost-button" id="clearChatSelection">선택해제</button>
                        <button type="button" class="danger-button" id="deleteSelectedChats">선택 삭제</button>
                    </div>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                        <tr>
                            <th><input type="checkbox" id="chatSelectAllCheckbox" aria-label="상담 전체 선택"></th>
                            <th>방 번호</th>
                            <th>카테고리</th>
                            <th>사용자</th>
                            <th>상태</th>
                            <th>안읽음</th>
                            <th>최근 메시지</th>
                            <th>접수일</th>
                            <th>관리</th>
                        </tr>
                        </thead>
                        <tbody id="adminChatTableBody">
                        <tr th:each="room : ${adminChatRoomList}">
                            <td>
                                <input type="checkbox"
                                       class="chat-row-checkbox"
                                       th:value="${room.roomNo}"
                                       th:disabled="${room.status != 'CLOSED'}"
                                       th:title="${room.status == 'CLOSED'} ? '삭제 선택' : '진행 중 상담은 종료 후 삭제할 수 있습니다.'"
                                       aria-label="상담 선택">
                            </td>
                            <td th:text="'#' + ${room.roomNo}">#1</td>
                            <td>
                                <span th:text="${room.categoryIcon}">💬</span>
                                <span th:text="${room.categoryName}">메일 문의</span>
                            </td>
                            <td th:text="${room.userNickname != null ? room.userNickname : '탈퇴/미지정'}">사용자</td>
                            <td><span class="status-pill" th:classappend="${room.status == 'OPEN'} ? ' open' : ' closed'" th:text="${room.statusName}">진행 중</span></td>
                            <td th:text="${room.unreadCount}">0</td>
                            <td class="ellipsis" th:text="${room.lastMessage != null and !#strings.isEmpty(room.lastMessage) ? room.lastMessage : '메시지 없음'}">최근 메시지</td>
                            <td th:text="${room.createdDate != null ? #temporals.format(room.createdDate, 'yyyy-MM-dd HH:mm') : '-'}">2026-07-13</td>
                            <td>
                                <div class="table-actions-inline">
                                    <a class="table-action" th:href="@{/admin/chats/{roomNo}(roomNo=${room.roomNo})}">상담 열기</a>
                                    <button type="button"
                                            class="table-action danger-action button-like"
                                            data-chat-delete-button
                                            th:if="${room.status == 'CLOSED'}"
                                            th:attr="data-room-no=${room.roomNo}">삭제</button>
                                    <span class="table-muted-action" th:if="${room.status != 'CLOSED'}">종료 후 삭제</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${adminChatRoomList == null or #lists.isEmpty(adminChatRoomList)}">
                            <td colspan="9" class="empty-cell">조회된 상담이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" id="adminChatPagination" th:if="${chatTotalPages > 1}">
                    <a th:if="${chatPage > 1}"
                       th:href="@{/admin(view='chats', chatStatus=${chatStatus}, chatCategory=${chatCategory}, chatKeyword=${chatKeyword}, chatPage=${chatPage - 1}, chatSize=${chatSize})}">이전</a>
                    <span th:each="pageNo : ${chatPageNumbers}">
                        <a th:href="@{/admin(view='chats', chatStatus=${chatStatus}, chatCategory=${chatCategory}, chatKeyword=${chatKeyword}, chatPage=${pageNo}, chatSize=${chatSize})}"
                           th:text="${pageNo}"
                           th:classappend="${pageNo == chatPage} ? ' active' : ''">1</a>
                    </span>
                    <a th:if="${chatPage < chatTotalPages}"
                       th:href="@{/admin(view='chats', chatStatus=${chatStatus}, chatCategory=${chatCategory}, chatKeyword=${chatKeyword}, chatPage=${chatPage + 1}, chatSize=${chatSize})}">다음</a>
                </div>
            </article>
        </section>
</body>
</html>
