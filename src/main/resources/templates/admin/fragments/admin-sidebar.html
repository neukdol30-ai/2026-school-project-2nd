<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside th:fragment="sidebar" class="admin-sidebar">
        <!-- 접속한 관리자 프로필 카드입니다. 내 정보 보기는 페이지 이동이 아니라 모달로 표시합니다. -->
        <section class="admin-profile-panel">
            <div class="profile-main">
                <div class="profile-avatar">
                    <img th:if="${loginAdmin != null and loginAdmin.profileImage != null and !#strings.isEmpty(loginAdmin.profileImage)}"
                         th:src="${loginAdmin.profileImage}"
                         alt="관리자 프로필 이미지">
                    <span th:unless="${loginAdmin != null and loginAdmin.profileImage != null and !#strings.isEmpty(loginAdmin.profileImage)}"
                          th:text="${loginAdmin != null and loginAdmin.nickname != null and !#strings.isEmpty(loginAdmin.nickname) ? #strings.substring(loginAdmin.nickname, 0, 1) : 'A'}">A</span>
                </div>
                <div class="profile-name-box">
                    <strong th:text="${loginAdmin != null ? loginAdmin.memberId : 'admin'}">admin01</strong>
                    <span th:text="${loginAdmin != null and loginAdmin.email != null and !#strings.isEmpty(loginAdmin.email) ? loginAdmin.email : '이메일 미등록'}">admin@example.com</span>
                </div>
            </div>

            <dl class="profile-meta">
                <div>
                    <dt>권한</dt>
                    <dd class="role-badge" th:text="${loginAdmin != null ? loginAdmin.role : 'ADMIN'}">ADMIN</dd>
                </div>
                <div>
                    <dt>회원번호</dt>
                    <dd th:text="${loginAdmin != null ? '#' + loginAdmin.no : '#'}">#1</dd>
                </div>
                <div>
                    <dt>가입일</dt>
                    <dd th:text="${loginAdmin != null and loginAdmin.regdate != null ? #temporals.format(loginAdmin.regdate, 'yyyy-MM-dd') : '미기록'}">2026-07-13</dd>
                </div>
                <div>
                    <dt>최근 로그인</dt>
                    <dd th:text="${loginAdmin != null and loginAdmin.lastLoginDate != null ? #temporals.format(loginAdmin.lastLoginDate, 'yyyy-MM-dd HH:mm') : '미기록'}">미기록</dd>
                </div>
            </dl>

            <button type="button" class="profile-detail-button" data-modal-open="adminProfileModal">
                내 정보 보기
            </button>
        </section>

        <nav class="admin-menu" aria-label="관리자 메뉴">
            <p class="menu-label">운영</p>
            <a th:href="@{/admin(view='dashboard')}"
               class="menu-item"
               th:classappend="${activeView == 'dashboard'} ? ' active' : ''">
                <span>🏠</span>
                <em>대시보드</em>
            </a>
            <p class="menu-label">DB 데이터 관리형</p>
            <a th:href="@{/admin(view='members')}"
               class="menu-item"
               th:classappend="${activeView == 'members' or activeView == 'memberEdit'} ? ' active' : ''">
                <span>👥</span>
                <em>회원 관리</em>
            </a>
            <a th:href="@{/admin(view='chats')}"
               class="menu-item"
               th:classappend="${activeView == 'chats' or activeView == 'chatRoom'} ? ' active' : ''">
                <span>💬</span>
                <em>상담 관리</em>
            </a>
            <a th:href="@{/admin(view='boards')}"
               class="menu-item"
               th:classappend="${activeView == 'boards' or activeView == 'boardCreate' or activeView == 'boardEdit' or activeView == 'boardDetail'} ? ' active' : ''">
                <span>📝</span>
                <em>게시글 관리</em>
            </a>
            <a th:href="@{/admin(view='visits')}"
               class="menu-item"
               th:classappend="${activeView == 'visits'} ? ' active' : ''">
                <span>📊</span>
                <em>방문 기록</em>
            </a>

            <p class="menu-label">외부 서비스 상태</p>
            <a th:href="@{/admin(view='services')}"
               class="menu-item"
               th:classappend="${activeView == 'services'} ? ' active' : ''">
                <span>🔌</span>
                <em>서비스 상태</em>
            </a>
        </nav>

        <details class="sidebar-card sidebar-tip-card" open>
            <summary>
                <strong>운영 팁</strong>
                <span>접기/펼치기</span>
            </summary>
            <div class="sidebar-tip-body">
                <p>관리자 콘솔 안에서 대시보드, 회원관리, 상담관리, 게시글, 방문 기록을 한 번에 처리합니다.</p>
                <a th:href="@{/admin(view='chats')}">상담 확인하기</a>
            </div>
        </details>
    </aside>
</body>
</html>
