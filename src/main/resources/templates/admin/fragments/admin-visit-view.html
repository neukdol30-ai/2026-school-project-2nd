<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="visitManageView" class="admin-view" th:classappend="${activeView == 'visits'} ? ' active' : ''" id="visitManageView">
    <article class="panel full-panel">
        <div class="panel-head with-actions">
            <div>
                <span class="eyebrow">Visit Log</span>
                <h2>방문 기록</h2>
                <p>분석 쿠키에 동의한 일반 사용자 방문 기록을 회원/IP 기준으로 확인합니다. 관리자 접속은 집계에서 제외됩니다.</p>
            </div>
            <a th:href="@{/admin(view='dashboard')}" class="small-link">대시보드</a>
        </div>

        <form class="admin-filter-form" th:action="@{/admin}" method="get">
            <input type="hidden" name="view" value="visits">
            <input type="text" name="visitKeyword" th:value="${visitKeyword}" placeholder="아이디, 이름, 닉네임, 회원번호, IP 검색">
            <button type="submit">검색</button>
            <a th:href="@{/admin(view='visits')}" class="reset-link">초기화</a>
        </form>

        <div class="table-toolbar">
            <div>
                <strong th:text="'사용자/IP 기준 ' + ${visitTotalCount} + '건'">사용자/IP 기준 0건</strong>
                <span>같은 IP는 하루 1회 저장 기준</span>
            </div>
        </div>

        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>회원번호</th>
                    <th>사용자</th>
                    <th>이름/닉네임</th>
                    <th>IP</th>
                    <th>방문 수</th>
                    <th>첫 방문</th>
                    <th>최근 방문</th>
                    <th>최근 경로</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="visit : ${adminVisitSummaryList}">
                    <td th:text="${visit.memberNo != null ? visit.memberNo : '-'}">1</td>
                    <td>
                        <strong th:text="${visit.displayUser}">user01</strong>
                        <span class="role-tag user" th:if="${visit.role != null}" th:text="${visit.role}">USER</span>
                    </td>
                    <td th:text="${visit.displayName}">닉네임</td>
                    <td th:text="${visit.ipAddress != null ? visit.ipAddress : '-'}">127.0.0.1</td>
                    <td th:text="${visit.visitCount}">1</td>
                    <td th:text="${visit.firstVisitDate != null ? #temporals.format(visit.firstVisitDate, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td th:text="${visit.lastVisitDate != null ? #temporals.format(visit.lastVisitDate, 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                    <td class="ellipsis" th:text="${visit.lastRequestUri != null ? visit.lastRequestUri : '-'}">/</td>
                </tr>
                <tr th:if="${adminVisitSummaryList == null or #lists.isEmpty(adminVisitSummaryList)}">
                    <td colspan="8" class="empty-cell">조회된 방문 기록이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${visitTotalPages > 1}">
            <a th:if="${visitPage > 1}"
               th:href="@{/admin(view='visits', visitKeyword=${visitKeyword}, visitPage=${visitPage - 1})}">이전</a>
            <span th:each="pageNo : ${#numbers.sequence(1, visitTotalPages)}">
                <a th:href="@{/admin(view='visits', visitKeyword=${visitKeyword}, visitPage=${pageNo})}"
                   th:text="${pageNo}"
                   th:classappend="${pageNo == visitPage} ? ' active' : ''">1</a>
            </span>
            <a th:if="${visitPage < visitTotalPages}"
               th:href="@{/admin(view='visits', visitKeyword=${visitKeyword}, visitPage=${visitPage + 1})}">다음</a>
        </div>
    </article>
</section>
</body>
</html>
