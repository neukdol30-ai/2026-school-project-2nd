<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 회원 관리 영역: /admin 내부에서 표시됩니다. -->
        <section th:fragment="memberManageView" class="admin-view" th:classappend="${activeView == 'members'} ? ' active' : ''" id="memberManageView">
            <article class="panel full-panel">
                <div class="panel-head with-actions">
                    <div>
                        <span class="eyebrow">Member Management</span>
                        <h2>회원 관리</h2>
                        <p>회원 검색, 페이징, 권한 부여, 회원 정지 처리를 관리자 콘솔 안에서 처리합니다.</p>
                    </div>
                    <a th:href="@{/admin(view='dashboard')}" class="small-link">대시보드</a>
                </div>

                <form class="admin-filter-form" th:action="@{/admin}" method="get">
                    <input type="hidden" name="view" value="members">
                    <input type="text" name="memberKeyword" th:value="${memberKeyword}" placeholder="아이디, 이름, 닉네임, 이메일, 전화번호, 권한, 정지 사유 검색">
                    <button type="submit">검색</button>
                    <a th:href="@{/admin(view='members')}" class="reset-link">초기화</a>
                </form>

                <div class="table-toolbar">
                    <div>
                        <strong th:text="'검색 결과 ' + ${memberTotalCount} + '명'">검색 결과 0명</strong>
                        <span id="selectedMemberCount">선택 0명</span>
                    </div>
                    <div class="toolbar-actions">
                        <button type="button" class="ghost-button" id="selectAllMembers">전체선택</button>
                        <button type="button" class="ghost-button" id="clearMemberSelection">선택해제</button>
                        <button type="button" class="danger-button" id="deleteSelectedMembers">선택 삭제</button>
                    </div>
                </div>

                <div class="admin-table-wrap">
                    <table class="admin-table selectable-table">
                        <thead>
                        <tr>
                            <th><input type="checkbox" id="memberSelectAllCheckbox" aria-label="전체 선택"></th>
                            <th>번호</th>
                            <th>아이디</th>
                            <th>이름/닉네임</th>
                            <th>이메일</th>
                            <th>연락처</th>
                            <th>권한</th>
                            <th>상태</th>
                            <th>가입일</th>
                            <th>관리</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="member : ${adminMemberList}" th:classappend="${member.banYn == 'Y'} ? ' banned-row' : ''">
                            <td>
                                <input type="checkbox"
                                       class="member-row-checkbox"
                                       th:value="${member.no}"
                                       th:disabled="${(loginAdmin != null and loginAdmin.no == member.no) or member.role == 'ADMIN'}"
                                       th:title="${loginAdmin != null and loginAdmin.no == member.no ? '현재 로그인 중인 관리자 본인은 삭제할 수 없습니다.' : (member.role == 'ADMIN' ? '관리자 계정은 USER 전환 후 삭제할 수 있습니다.' : '회원 선택')}"
                                       aria-label="회원 선택">
                            </td>
                            <td th:text="${member.no}">1</td>
                            <td th:text="${member.memberId}">user01</td>
                            <td>
                                <strong th:text="${member.name != null and !#strings.isEmpty(member.name) ? member.name : '-'}">홍길동</strong>
                                <span th:text="${member.nickname}">닉네임</span>
                            </td>
                            <td th:text="${member.email != null and !#strings.isEmpty(member.email) ? member.email : '미등록'}">email@test.com</td>
                            <td th:text="${member.phone != null and !#strings.isEmpty(member.phone) ? member.phone : '미등록'}">010</td>
                            <td><span class="role-tag" th:classappend="${member.role == 'ADMIN'} ? ' admin' : ' user'" th:text="${member.role}">USER</span></td>
                            <td>
                                <span th:if="${member.banYn == 'Y'}" class="status-tag banned">정지</span>
                                <span th:if="${member.banYn != 'Y'}" class="status-tag active">정상</span>
                                <small th:if="${member.banYn == 'Y' and member.banReason != null and !#strings.isEmpty(member.banReason)}"
                                       class="ban-reason-preview"
                                       th:text="${member.banReason}">정지 사유</small>
                            </td>
                            <td th:text="${member.regdate != null ? #temporals.format(member.regdate, 'yyyy-MM-dd') : '-'}">2026-07-13</td>
                            <td>
                                <div class="table-actions-inline member-actions">
                                    <button type="button"
                                            class="table-action button-like"
                                            data-member-detail-button
                                            th:attr="data-member-no=${member.no},
                                                     data-member-id=${member.memberId},
                                                     data-member-name=${member.name},
                                                     data-member-nickname=${member.nickname},
                                                     data-member-email=${member.email},
                                                     data-member-phone=${member.phone},
                                                     data-member-role=${member.role},
                                                     data-member-ban-yn=${member.banYn},
                                                     data-member-ban-reason=${member.banReason},
                                                     data-member-banned-date=${member.bannedDate != null ? #temporals.format(member.bannedDate, 'yyyy-MM-dd HH:mm') : '미기록'},
                                                     data-member-regdate=${member.regdate != null ? #temporals.format(member.regdate, 'yyyy-MM-dd HH:mm') : '미기록'}">
                                        상세
                                    </button>
                                    <a class="table-action" th:href="@{/admin/members/{no}/edit(no=${member.no})}">수정</a>

                                    <button type="button"
                                            class="table-action promote-action button-like"
                                            th:if="${member.role != 'ADMIN' and member.banYn != 'Y' and (loginAdmin == null or loginAdmin.no != member.no)}"
                                            data-member-promote-button
                                            th:attr="data-member-no=${member.no}, data-member-id=${member.memberId}">관리자 지정</button>

                                    <span class="table-muted-action"
                                          th:if="${member.role != 'ADMIN' and member.banYn == 'Y' and (loginAdmin == null or loginAdmin.no != member.no)}">정지 회원 권한부여 불가</span>

                                    <button type="button"
                                            class="table-action warning-action button-like"
                                            th:if="${member.role == 'ADMIN' and (loginAdmin == null or loginAdmin.no != member.no)}"
                                            data-member-demote-button
                                            th:attr="data-member-no=${member.no}, data-member-id=${member.memberId}">USER 전환</button>

                                    <button type="button"
                                            class="table-action warning-action button-like"
                                            th:if="${member.banYn != 'Y' and member.role != 'ADMIN' and (loginAdmin == null or loginAdmin.no != member.no)}"
                                            data-member-ban-button
                                            th:attr="data-member-no=${member.no}, data-member-id=${member.memberId}">정지</button>

                                    <span class="table-muted-action"
                                          th:if="${member.role == 'ADMIN' and member.banYn != 'Y' and (loginAdmin == null or loginAdmin.no != member.no)}">USER 전환 후 정지</span>

                                    <button type="button"
                                            class="table-action button-like"
                                            th:if="${member.banYn == 'Y' and (loginAdmin == null or loginAdmin.no != member.no)}"
                                            data-member-unban-button
                                            th:attr="data-member-no=${member.no}, data-member-id=${member.memberId}">정지 해제</button>

                                    <span class="table-muted-action"
                                          th:if="${member.role == 'ADMIN' and (loginAdmin == null or loginAdmin.no != member.no)}">USER 전환 후 삭제</span>

                                    <button type="button"
                                            class="table-action danger-action button-like"
                                            data-member-delete-button
                                            th:if="${member.role != 'ADMIN' and (loginAdmin == null or loginAdmin.no != member.no)}"
                                            th:attr="data-member-no=${member.no}, data-member-id=${member.memberId}">삭제</button>
                                    <span class="table-muted-action" th:if="${loginAdmin != null and loginAdmin.no == member.no}">본인 계정</span>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${adminMemberList == null or #lists.isEmpty(adminMemberList)}">
                            <td colspan="10" class="empty-cell">조회된 회원이 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pagination" th:if="${memberTotalPages > 1}">
                    <a th:if="${memberPage > 1}"
                       th:href="@{/admin(view='members', memberKeyword=${memberKeyword}, memberPage=${memberPage - 1})}">이전</a>
                    <span th:each="pageNo : ${memberPageNumbers}">
                        <a th:href="@{/admin(view='members', memberKeyword=${memberKeyword}, memberPage=${pageNo})}"
                           th:text="${pageNo}"
                           th:classappend="${pageNo == memberPage} ? ' active' : ''">1</a>
                    </span>
                    <a th:if="${memberPage < memberTotalPages}"
                       th:href="@{/admin(view='members', memberKeyword=${memberKeyword}, memberPage=${memberPage + 1})}">다음</a>
                </div>
            </article>
        </section>
</body>
</html>
