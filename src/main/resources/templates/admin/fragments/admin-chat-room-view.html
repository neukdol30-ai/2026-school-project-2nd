<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="chatRoomView"
         class="admin-view"
         th:classappend="${activeView == 'chatRoom'} ? ' active' : ''"
         th:attr="data-room-no=${chatRoom != null ? chatRoom.roomNo : ''}"
         id="chatRoomView">
    <article class="panel full-panel chat-room-panel" th:if="${chatRoom != null}">
        <!--
            상담 상세 압축 레이아웃
            - 상담방 번호/유형/상태는 왼쪽 미니 패널에만 표시합니다.
            - 상단 중복 헤더를 제거해서 채팅 메시지 영역의 실제 높이를 확보합니다.
        -->
        <div class="embedded-chat-room compact-chat-layout">
            <!--
                왼쪽 미니 패널
                - 상담방 운영에 필요한 최소 정보만 고정 노출합니다.
                - 작은 화면에서는 CSS에서 위쪽 요약 카드 형태로 바뀝니다.
            -->
            <aside class="embedded-chat-side compact-chat-side">
                <div class="side-title compact-side-title">
                    <span th:text="${chatRoom.categoryIcon}">💬</span>
                    <div>
                        <h3>상담방 #<b th:text="${chatRoom.roomNo}">0</b></h3>
                        <p th:text="${chatRoom.categoryName}">기타 문의</p>
                    </div>
                </div>

                <div class="info-stack compact-info-stack">
                    <div class="info-card compact-info-card">
                        <span>사용자 번호</span>
                        <strong th:text="${chatRoom.userNo != null ? chatRoom.userNo : '탈퇴 회원'}">1</strong>
                    </div>
                    <div class="info-card compact-info-card">
                        <span>담당 관리자</span>
                        <strong th:text="${chatRoom.adminNo != null ? chatRoom.adminNo : '미배정'}">미배정</strong>
                    </div>
                    <div class="info-card compact-info-card">
                        <span>상담 상태</span>
                        <strong th:classappend="${chatRoom.status == 'OPEN'} ? ' status-open' : ' status-closed'"
                                th:text="${chatRoom.status == 'OPEN'} ? '진행 중' : '종료'">진행 중</strong>
                    </div>
                    <div class="info-card compact-info-card compact-created-card">
                        <span>생성 시간</span>
                        <strong th:text="${chatRoom.createdDate != null ? #temporals.format(chatRoom.createdDate, 'MM-dd HH:mm') : '-'}">-</strong>
                    </div>
                </div>

                <div class="side-actions compact-side-actions">
                    <form th:if="${chatRoom.status == 'OPEN'}"
                          th:action="@{/admin/chats/{roomNo}/close(roomNo=${chatRoom.roomNo})}"
                          method="post"
                          onsubmit="return confirm('상담을 종료하시겠습니까? 종료 후에는 메시지를 보낼 수 없습니다.');">
                        <button type="submit" class="close-btn">상담 종료</button>
                    </form>

                    <form th:if="${chatRoom.status == 'CLOSED'}"
                          th:action="@{/admin/chats/{roomNo}/delete(roomNo=${chatRoom.roomNo})}"
                          method="post"
                          onsubmit="return confirm('상담방과 메시지가 모두 삭제됩니다. 정말 삭제하시겠습니까?');">
                        <button type="submit" class="delete-btn">상담방 삭제</button>
                    </form>

                    <!-- 상담 화면 이동 버튼은 미니 패널 안으로 이동해 상단 중복 영역을 없앱니다. -->
                    <div class="compact-side-navigation">
                        <a th:href="@{/admin(view='chats')}" class="small-link">상담 목록</a>
                        <a th:href="@{/admin(view='dashboard')}" class="small-link">대시보드</a>
                    </div>
                </div>
            </aside>

            <!--
                오른쪽 채팅 응대 영역
                - 안내 문구, 메시지 목록, 입력창만 남긴 채팅 중심 구조입니다.
                - 메시지 목록만 내부 스크롤되고 입력창은 하단에 고정됩니다.
            -->
            <section class="embedded-chat-panel compact-chat-panel">
                <div class="notice-bar compact-notice-bar">상담 종료 전까지 실시간 답변이 가능합니다. 종료 후에는 입력창이 자동 비활성화됩니다.</div>
                <div id="chatBody" class="chat-body compact-chat-body"></div>

                <div class="chat-input-box compact-chat-input-box">
                    <input type="text"
                           id="messageInput"
                           th:placeholder="${chatRoom.status == 'CLOSED'} ? '상담이 종료되었습니다.' : '답변을 입력하세요'"
                           th:attr="data-max-length=${chatMessageMaxLength}"
                           aria-describedby="messageInputStatus messageLengthCounter"
                           th:disabled="${chatRoom.status == 'CLOSED'}">
                    <button type="button" id="sendBtn" th:disabled="${chatRoom.status == 'CLOSED'}">전송</button>
                    <div class="chat-input-meta">
                        <span id="messageInputStatus" class="chat-input-status" role="status" aria-live="polite"></span>
                        <span id="messageLengthCounter" class="message-length-counter">
                            0 / <b th:text="${chatMessageMaxLength}">1000</b>
                        </span>
                    </div>
                </div>
            </section>
        </div>
    </article>
</section>
</body>
</html>
