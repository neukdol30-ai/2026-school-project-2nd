<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="flash" class="admin-flash-area" th:if="${adminMessage != null or adminErrorMessage != null}">
            <div class="admin-flash success" th:if="${adminMessage != null}" th:text="${adminMessage}">처리 완료</div>
            <div class="admin-flash error" th:if="${adminErrorMessage != null}" th:text="${adminErrorMessage}">처리 실패</div>
        </div>
</body>
</html>
