<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 목록 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/member-list.css}">
</head>
<body>

<div class="page-wrap">
    <div class="list-box">
        <h1 class="page-title">회원 목록</h1>
        <div class="table-scroll">
        <table class="member-table">
            <thead>
            <tr>
                <th class="col-center">번호</th>
                <th>아이디</th>
                <th>이름</th>
                <th>닉네임</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th class="col-center">권한</th>
                <th class="col-center">가입일</th>
                <th class="col-center">관리</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="member : ${memberList}">
                <td class="col-center" th:text="${member.no}"></td>
                <td th:text="${member.memberId}"></td>
                <td th:text="${member.name}"></td>
                <td th:text="${member.nickname}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.phone}"></td>
                <td class="col-center" th:text="${member.role}"></td>
                <td class="col-center" th:text="${#temporals.format(member.regdate, 'yyyy-MM-dd')}"></td>
                <td class="col-center">
                    <!--상세 버튼, 회원 no 이용 -> /admin/members/{no} 주소-->
                    <a th:href="@{/admin/members/{no}(no=${member.no})}"
                    class="btn-action btn-detail">상세</a> <!-- CSS -> btn-action / btn-detail -->

                    <a th:href="@{/admin/members/{no}/edit(no=${member.no})}"
                    class="btn-action btn-edit">수정</a>
                </td>
            </tr>
            </tbody>
        </table>
        </div>

        <a th:href="@{/admin}" class="bottom-link">← 관리자 메인으로</a>
    </div>
</div>
</body>
</html>
