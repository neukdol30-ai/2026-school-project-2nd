<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 상세 - 관리자</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/member-list.css}">
</head>
<body>

<div class="page-wrap">
    <div class="list-box">
        <h1 class="page-title">회원 상세</h1>

        <!--회원 한명(member)의 각 필드를 표로 보여줌-->
        <table class="detail-table"> <!--member-table->detail-table 변경. 상세용 세로 표 스타일 -->
            <tbody>
            <tr>
                <th>번호</th>
                <td th:text="${member.no}"></td>
            </tr>
            <tr>
                <th>아이디</th>
                <td th:text="${member.memberId}"></td>
            </tr>
            <tr>
                <th>이름</th>
                <td th:text="${member.name}"></td>
            </tr>
            <tr>
                <th>닉네임</th>
                <td th:text="${member.nickname}"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="${member.email}"></td>
            </tr>
            <tr>
                <th>전화번호</th>
                <td th:text="${member.phone}"></td>
            </tr>
            <tr>
                <th>생년월일</th>
                <td th:text="${member.birthDate}"></td>
            </tr>
            <tr>
                <th>성별</th>
                <td th:text="${member.gender}"></td>
            </tr>
            <tr>
                <th>주소</th>
                <td th:text="${member.address}"></td>
            </tr>
            <tr>
                <th>상세주소</th>
                <td th:text="${member.detailAddress}"></td>
            </tr>
            <tr>
                <th>권한</th>
                <td th:text="${member.role}"></td>
            </tr>
            <tr>
                <th>가입일</th>
                <td th:text="${#temporals.format(member.regdate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            </tbody>
        </table>

        <!--목록으로 돌아가는 링크-->
        <a th:href="@{/admin/members}" class="bottom-link">← 회원 목록으로</a>
    </div>
</div>
</body>
</html>
