<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/admin">
    <title>관리자 콘솔로 이동 중</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f6f8fb;
            color: #1f2937;
        }
        .legacy-redirect-box {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            text-align: center;
        }
        .legacy-redirect-box strong {
            display: block;
            margin-bottom: 10px;
            font-size: 22px;
        }
        .legacy-redirect-box p {
            margin: 0 0 18px;
            color: #64748b;
            line-height: 1.6;
        }
        .legacy-redirect-box a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 999px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="legacy-redirect-box">
    <strong>관리자 콘솔로 이동합니다.</strong>
    <p>이전 관리자 메인 화면은 통합 관리자 콘솔로 정리되었습니다.</p>
    <a th:href="@{/admin}">관리자 콘솔 열기</a>
</div>
<script>
    window.location.replace('/admin');
</script>
</body>
</html>
