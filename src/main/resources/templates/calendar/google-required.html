<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>구글 캘린더 연동 필요</title>

    <!-- 캘린더 공통 CSS -->
    <link rel="stylesheet" href="/css/calendar.css">
</head>

<body>

<!-- ========================= -->
<!-- 구글 캘린더 연동 안내 화면 -->
<!-- 역할: 구글 미연동 상태에서 동기화를 누른 경우 안내 -->
<!-- ========================= -->
<main class="google-required-page">

    <section class="google-required-card">

        <div class="google-required-icon">
            !
        </div>

        <h1>구글 캘린더 연동이 필요합니다</h1>

        <p class="google-required-description">
            개인 일정 동기화 기능은 구글 캘린더를 연동한 후 사용할 수 있습니다.
        </p>

        <p class="google-required-sub-description">
            구글 캘린더를 연동하지 않아도 대한민국 공휴일은 계속 확인할 수 있습니다.
        </p>

        <div class="google-required-actions">

            <!-- 구글 캘린더 OAuth 연동 시작 -->
            <a href="/google/calendar/connect"
               class="google-required-connect-button">
                구글 캘린더 연동하기
            </a>

            <!-- 보고 있던 날짜가 있으면 해당 날짜로 돌아감 -->
            <a th:if="${date != null and !date.isBlank()}"
               th:href="@{/calendar(date=${date})}"
               class="google-required-back-button">
                캘린더로 돌아가기
            </a>

            <!-- 날짜 정보가 없으면 기본 캘린더로 돌아감 -->
            <a th:unless="${date != null and !date.isBlank()}"
               href="/calendar"
               class="google-required-back-button">
                캘린더로 돌아가기
            </a>

        </div>

    </section>

</main>

</body>
</html>
