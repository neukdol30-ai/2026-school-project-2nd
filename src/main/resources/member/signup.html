<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>

<body>

<h1>회원가입</h1>

<!-- 회원가입 실패 메시지 -->
<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   style="color:red;"></p>

<!-- 회원가입 성공 메시지 -->
<p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color:blue;"></p>

<!-- 회원가입 요청 -->
<form th:action="@{/member/signup}"
      method="post"
      onsubmit="return validateForm()">

    <!-- Spring Security CSRF가 켜져 있을 때 필요 -->
    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div>
        <label>아이디</label>

        <!-- PortalMemberDto.memberId로 들어감 -->
        <input type="text"
               id="memberId"
               name="memberId"
               required>

        <!-- /member/id-check 호출 -->
        <button type="button"
                onclick="idCheck()">
            중복확인
        </button>

        <span id="checkResult"></span>
    </div>

    <div>
        <label>비밀번호</label>

        <!-- PortalMemberDto.password로 들어감 -->
        <input type="password"
               id="password"
               name="password"
               required>

        <p id="passwordRule"></p>
    </div>

    <div>
        <label>비밀번호 확인</label>

        <!-- DB 컬럼 아님, 서버에서 password와 비교 -->
        <input type="password"
               id="passwordCheck"
               name="passwordCheck"
               required>

        <p id="pwResult"></p>
    </div>

    <div>
        <label>이름</label>

        <!-- PortalMemberDto.name으로 들어감 -->
        <input type="text"
               name="name"
               required>
    </div>

    <div>
        <label>닉네임</label>

        <!-- DB의 NICKNAME이 NOT NULL이라 필수 -->
        <input type="text"
               name="nickname"
               required>
    </div>

    <div>
        <label>이메일</label>

        <!-- 이메일은 선택값 -->
        <input type="email"
               name="email">
    </div>

    <div>
        <label>
            <!-- 체크하면 agreeTermsYn=Y로 넘어감 -->
            <input type="checkbox"
                   id="agreeTermsYn"
                   name="agreeTermsYn"
                   value="Y">
            이용약관에 동의합니다.
        </label>
    </div>

    <div>
        <label>
            <!-- 체크하면 agreePrivacyYn=Y로 넘어감 -->
            <input type="checkbox"
                   id="agreePrivacyYn"
                   name="agreePrivacyYn"
                   value="Y">
            개인정보 처리방침에 동의합니다.
        </label>
    </div>

    <button type="submit">
        회원가입
    </button>

</form>

<hr>

<a href="/member/login">로그인 페이지로 이동</a>

<script>
    let idChecked = false;
    let checkedMemberId = "";

    const memberIdInput =
        document.getElementById("memberId");

    const password =
        document.getElementById("password");

    const passwordCheck =
        document.getElementById("passwordCheck");

    // 아이디를 바꾸면 중복확인 다시 하게 처리
    memberIdInput.addEventListener("input", function () {
        idChecked = false;
        checkedMemberId = "";

        document.getElementById("checkResult").innerText = "";
    });

    // 아이디 중복확인
    function idCheck() {

        const memberId =
            memberIdInput.value.trim();

        const result =
            document.getElementById("checkResult");

        if (memberId === "") {
            result.style.color = "red";
            result.innerText = "아이디를 입력해주세요.";
            return;
        }

        fetch("/member/id-check?memberId=" + encodeURIComponent(memberId))
            .then(response => response.json())
            .then(data => {

                if (data.isDuplicate) {

                    idChecked = false;
                    checkedMemberId = "";

                    result.style.color = "red";
                    result.innerText =
                        "이미 사용 중인 아이디입니다.";

                } else {

                    idChecked = true;
                    checkedMemberId = memberId;

                    result.style.color = "blue";
                    result.innerText =
                        "사용 가능한 아이디입니다.";
                }
            });
    }

    // 비밀번호 규칙 실시간 검사
    password.addEventListener("keyup", function () {

        const regex =
            /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

        const result =
            document.getElementById("passwordRule");

        if (regex.test(password.value)) {

            result.style.color = "blue";
            result.innerText =
                "사용 가능한 비밀번호입니다.";

        } else {

            result.style.color = "red";
            result.innerText =
                "8자 이상, 영문과 숫자를 포함해야 합니다.";
        }
    });

    // 비밀번호 확인 실시간 검사
    passwordCheck.addEventListener("keyup", function () {

        const result =
            document.getElementById("pwResult");

        if (password.value === passwordCheck.value) {

            result.style.color = "blue";
            result.innerText =
                "비밀번호가 일치합니다.";

        } else {

            result.style.color = "red";
            result.innerText =
                "비밀번호가 일치하지 않습니다.";
        }
    });

    // 최종 제출 전 검사
    function validateForm() {

        const memberId =
            memberIdInput.value.trim();

        const pw =
            password.value;

        const pwCheck =
            passwordCheck.value;

        const regex =
            /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;

        if (!idChecked || checkedMemberId !== memberId) {
            alert("아이디 중복확인을 해주세요.");
            return false;
        }

        if (!regex.test(pw)) {
            alert("비밀번호는 8자 이상, 영문과 숫자를 포함해야 합니다.");
            return false;
        }

        if (pw !== pwCheck) {
            alert("비밀번호 확인이 일치하지 않습니다.");
            return false;
        }

        if (!document.getElementById("agreeTermsYn").checked) {
            alert("이용약관에 동의해주세요.");
            return false;
        }

        if (!document.getElementById("agreePrivacyYn").checked) {
            alert("개인정보 처리방침에 동의해주세요.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
