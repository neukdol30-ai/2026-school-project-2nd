# birthDate에 존재하지 않는 날짜(예: 6월 31일)가 서버까지 왔을 때
# Spring이 자동 생성하는 영어 기술 메시지 대신 이 한국어 문구를 표시한다.
# 키 형식: typeMismatch.[모델 이름].[필드 이름]
#   typeMismatch : Spring이 "타입 변환 실패"에 붙이는 고정 접두사 [프레임워크 내부 규칙]
#   signupDto    : MemberController의 @ModelAttribute("signupDto")와 일치해야 함
#   birthDate    : SignupDto.java의 필드명과 일치해야 함
typeMismatch.signupDto.birthDate=존재하지 않는 날짜입니다. 실제로 있는 날짜를 다시 입력해 주세요.