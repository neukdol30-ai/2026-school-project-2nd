spring:
  application:
    # 프로젝트 이름
    name: it-project-2nd
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  datasource:
    # Oracle DB 드라이버
    driver-class-name: oracle.jdbc.OracleDriver
    # Oracle XE 접속 주소
    url: jdbc:oracle:thin:@localhost:1521:XE
    # DBeaver에서 쓰는 DB 계정
    username: secondpro
    # DBeaver에서 쓰는 DB 비밀번호
    password: 1234
  # ──── Redis 추가 ────
  data:
    redis:
      # Redis 서버 주소(내 컴퓨터에서 실행 시 localhost)
      host: localhost
      # Redis 기본 포트
      port: 6379
  thymeleaf:
    # HTML 수정 후 새로고침 반영
    cache: false
server:
  # 서버 포트
  port: 8080
  servlet:
    session:
      persistent: false
mybatis:
  # mapper.xml 위치
  mapper-locations: classpath:mapper/**/*.xml
  # DTO 패키지 위치
  type-aliases-package:
    com.siyan1234.itproject2nd.member.dto,
    com.siyan1234.itproject2nd.chat.dto,
    com.siyan1234.itproject2nd.admin.dto,
    com.siyan1234.itproject2nd.News.dto
  configuration:
    # MEMBER_ID -> memberId 자동 매칭
    # AGREE_TERMS_YN -> agreeTermsYn 자동 매칭
    map-underscore-to-camel-case: true
kakao:
  notify:
    enabled: ${KAKAO_NOTIFY_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/kakao/callback}
    admin-refresh-token: ${KAKAO_ADMIN_REFRESH_TOKEN:}
    admin-room-base-url: ${KAKAO_ADMIN_ROOM_BASE_URL:http://localhost:8080/chat/admin}